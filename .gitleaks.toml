# gitleaks configuration - extends the upstream default rule set.
# Allowlist ONLY well-known local-development placeholders; every entry must
# be reviewed by @OWNER/wellnessz-security (see CODEOWNERS).
title = "WellnessZ gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Documented local-only placeholders"
regexTarget = "match"
regexes = [
  # Keycloak local realm / compose placeholders
  '''change-me-local-only''',
  '''REPLACE-ME[-A-Za-z0-9]*''',
  # Published test-user password for the local realm (temporary, forced change)
  '''ChangeMe!123''',
  # PostgreSQL parameter value (password_encryption = SCRAM-SHA-256), not a secret
  '''SCRAM-SHA-256''',
]
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)terraform\.tfvars\.example$''',
  '''(^|/)backend\.hcl\.example$''',
  '''(^|/)package-lock\.json$''',
]

# Historical exception (risk accepted, security review required to extend):
# commit 2a679ab64738fd82f8f64264fc1cf38cc50776d5 contained random, test-only AES keys in two test fixtures.
# They were never used in any environment and were removed in 3f43941
# (keys are now generated at test runtime). Scoped to that commit AND those files.
[[allowlists]]
description = "Removed test-only keys in initial commit"
condition = "AND"
commits = ["2a679ab64738fd82f8f64264fc1cf38cc50776d5"]
paths = [
  '''apps/wz-core-app/src/test/resources/application-test\.yml''',
  '''apps/wz-bff/src/test/resources/application-test\.yml''',
]
