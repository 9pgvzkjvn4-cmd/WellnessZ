# =============================================================================
# Container images: build -> Trivy gate (CRITICAL/HIGH) -> push -> SBOM +
# provenance attestations -> cosign keyless signature (GitHub OIDC).
# Registry selectable: GHCR (default), Azure ACR or Google Artifact Registry,
# all with OIDC federation - no long-lived registry credentials.
#
# Repository/environment variables used:
#   ACR:  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, ACR_NAME
#   GAR:  GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, GAR_LOCATION,
#         GCP_PROJECT_ID, BINAUTHZ_ATTESTOR, BINAUTHZ_KMS_KEY_VERSION (optional)
# =============================================================================
name: Container images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      registry:
        description: Target registry
        type: choice
        options: [ghcr, acr, gar]
        default: ghcr
  workflow_call:
    inputs:
      registry:
        type: string
        default: ghcr
    outputs:
      image-tag:
        description: Tag that was pushed
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_KIND: ${{ inputs.registry || 'ghcr' }}

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write        # GHCR push
      id-token: write        # OIDC: cosign keyless, Azure/GCP federation, attestations
      attestations: write    # SBOM + provenance attestations
      security-events: write # Trivy SARIF
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: wz-core-app
            context: .
            dockerfile: deploy/docker/Dockerfile.core
          - image: wz-bff
            context: .
            dockerfile: deploy/docker/Dockerfile.bff
          - image: employee-app
            context: web/employee-app
            dockerfile: web/employee-app/Dockerfile
          - image: manager-workspace
            context: web/manager-workspace
            dockerfile: web/manager-workspace/Dockerfile
          - image: oh-workspace
            context: web/oh-workspace
            dockerfile: web/oh-workspace/Dockerfile
          - image: partner-portal
            context: web/partner-portal
            dockerfile: web/partner-portal/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve registry
        id: vars
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          GAR_LOCATION: ${{ vars.GAR_LOCATION }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          case "$REGISTRY_KIND" in
            ghcr) prefix="ghcr.io/${OWNER,,}/wellnessz" ;;
            acr)  prefix="${ACR_NAME}.azurecr.io/wellnessz" ;;
            gar)  prefix="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/wellnessz" ;;
            *) echo "unknown registry $REGISTRY_KIND"; exit 1 ;;
          esac
          echo "image=${prefix}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME}"; else tag="sha-${GITHUB_SHA::12}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # ---- registry authentication (OIDC) ----
      - name: Log in to GHCR
        if: env.REGISTRY_KIND == 'ghcr'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure login (OIDC)
        if: env.REGISTRY_KIND == 'acr'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        if: env.REGISTRY_KIND == 'acr'
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Google auth (Workload Identity Federation)
        if: env.REGISTRY_KIND == 'gar'
        id: gauth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        if: env.REGISTRY_KIND == 'gar'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gauth.outputs.access_token }}

      # ---- build & gate ----
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Build (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: scan/${{ matrix.image }}:${{ steps.vars.outputs.tag }}
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Trivy vulnerability gate (CRITICAL/HIGH, fixed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: scan/${{ matrix.image }}:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          scanners: vuln,secret,misconfig
          format: table

      - name: Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: scan/${{ matrix.image }}:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          skip-setup-trivy: true

      - name: Upload Trivy SARIF
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image)) != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      # ---- publish (only after the gate passed; reuses the build cache) ----
      - name: Build & push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Generate SBOM (CycloneDX via Syft)
        if: steps.push.outcome == 'success'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image }}.cdx.json
          artifact-name: sbom-image-${{ matrix.image }}.cdx.json

      - name: Attest SBOM
        if: steps.push.outcome == 'success'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.cdx.json
          push-to-registry: true

      - name: Attest build provenance (SLSA)
        if: steps.push.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.push.outcome == 'success'

      - name: Cosign keyless sign (Fulcio/Rekor via GitHub OIDC)
        if: steps.push.outcome == 'success'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate "sbom-${{ matrix.image }}.cdx.json" "${IMAGE}@${DIGEST}"

      - name: Binary Authorization attestation (GAR only)
        if: steps.push.outcome == 'success' && env.REGISTRY_KIND == 'gar' && vars.BINAUTHZ_ATTESTOR != ''
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          ATTESTOR: ${{ vars.BINAUTHZ_ATTESTOR }}
          KMS_KEY_VERSION: ${{ vars.BINAUTHZ_KMS_KEY_VERSION }}
        run: |
          gcloud container binauthz attestations sign-and-create \
            --artifact-url="${IMAGE}@${DIGEST}" \
            --attestor="${ATTESTOR}" \
            --keyversion="${KMS_KEY_VERSION}"

      - name: Summary
        if: steps.push.outcome == 'success'
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo "- image: \`${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}\`"
            echo "- tags: ${{ steps.vars.outputs.tag }}"
            echo "- Trivy gate: passed (CRITICAL/HIGH, fixed)"
            echo "- cosign keyless signature + SBOM + SLSA provenance attestations"
          } >> "$GITHUB_STEP_SUMMARY"
