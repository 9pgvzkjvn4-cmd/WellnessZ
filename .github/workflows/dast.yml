# =============================================================================
# DAST - OWASP ZAP baseline scan (passive, report only) against STAGING
# (E34-HLR-06 / E34-F05 / E34-BL-005; documented in docs/security/DAST-ZAP-Baseline.md).
#   * zap-baseline.py: spiders each URL (1 minute) and reports PASSIVE findings only - no attack
#     traffic. Active scanning stays a manual, approved activity (penetration test, E34-BL-012).
#   * Report only: the job never fails the build on findings (-I and exit code ignored); findings
#     are triaged by Security Operations into the vulnerability register (/device-security/sdlc).
#   * Runs only via the protected GitHub Environment `dast-staging` (required reviewers:
#     Security Operations; deployment branch main), which holds:
#       vars.DAST_TARGET_URLS   space separated staging URLs, e.g.
#                               "https://employee.uat.<domain>/ https://oh.uat.<domain>/ https://api.uat.<domain>/api/v1/me"
#     The API (OpenAPI-driven) scan is tools/device-security/11_zap_api_baseline.sh, run by
#     .github/workflows/device-security-pack.yml.
#   * Never point it at production without a change ticket (same rule as tools/device-security/11).
# =============================================================================
name: DAST (ZAP baseline)

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 2" # weekly, Tuesday 03:23 UTC

permissions:
  contents: read

concurrency:
  group: dast-staging
  cancel-in-progress: false

jobs:
  zap-baseline:
    name: ZAP baseline (staging, report only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: dast-staging
    permissions:
      contents: read
    env:
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.16.1
      TARGETS: ${{ vars.DAST_TARGET_URLS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard - staging targets only
        run: |
          set -euo pipefail
          [ -n "$TARGETS" ] || { echo "::error::vars.DAST_TARGET_URLS is not set in environment dast-staging"; exit 1; }
          for u in $TARGETS; do
            case "$u" in
              https://*) ;;
              *) echo "::error::target $u is not https://"; exit 1 ;;
            esac
            host=${u#https://}; host=${host%%/*}
            # production hosts have no environment label (employee.<domain>); staging = *.uat.* / *.staging.*
            if ! [[ "$host" =~ \.(uat|staging)\. ]]; then echo "::error::$host is not a staging host - refusing"; exit 1; fi
          done

      - name: ZAP baseline (passive)
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/zap"; mkdir -p "$out"; chmod 0777 "$out"
          docker pull -q "$ZAP_IMAGE"
          i=0
          for u in $TARGETS; do
            i=$((i + 1))
            # -m 1: one-minute spider; -I: do not fail on warnings; exit code ignored by design (report only)
            docker run --rm -v "$out:/zap/wrk:rw" "$ZAP_IMAGE" zap-baseline.py \
              -t "$u" -m 1 -I -J "baseline-$i.json" -r "baseline-$i.html" -w "baseline-$i.md" \
              || echo "zap-baseline exit $? for $u (report only)"
          done
          cp -r "$out" "$GITHUB_WORKSPACE/zap-reports"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          cd zap-reports 2>/dev/null || { echo "no reports"; exit 0; }
          sha256sum ./*.json ./*.html ./*.md 2>/dev/null > SHA256SUMS || true
          {
            echo "### ZAP baseline (staging) - report only"
            echo '| Report | High | Medium | Low | Informational |'
            echo '|---|---|---|---|---|'
            for j in baseline-*.json; do
              [ -e "$j" ] || continue
              python3 -c 'import json,sys
          d=json.load(open(sys.argv[1])); c={3:0,2:0,1:0,0:0}
          for s in d.get("site",[]):
              for a in s.get("alerts",[]): c[int(a.get("riskcode",0))]+=1
          print(f"| {sys.argv[1]} | {c[3]} | {c[2]} | {c[1]} | {c[0]} |")' "$j"
            done
            echo
            echo "Findings are triaged by Security Operations (docs/security/DAST-ZAP-Baseline.md); this job never fails on them."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-baseline-${{ github.run_id }}
          path: zap-reports/
          if-no-files-found: warn
          retention-days: 90
