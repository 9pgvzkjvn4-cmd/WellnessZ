<text x="1100.0" y="297.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">api.wellnessz.onprem...</text>
<text x="1100.0" y="313.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">internal PKI TLS, optional mTLS</text>
<rect x="1290" y="245" width="340" height="90" rx="8" ry="8" fill="#E5F3EA" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="1460.0" y="279.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D4F" text-anchor="middle">wz-core-app + Flyway Job</text>
<text x="1460.0" y="297.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">integrations, EHS mailbox</text>
<text x="1460.0" y="313.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">HL7 / FHIR to OH systems</text>
<rect x="930" y="360" width="700" height="120" rx="8" ry="8" fill="#EEF3F8" stroke="#1B365D" stroke-width="1.6"/>
<text x="1280.0" y="401.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B365D" text-anchor="middle">CloudNativePG cluster wellnessz-db (3 instances)</text>
<text x="1280.0" y="419.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">PostgreSQL 16.15 · synchronous replica (RPO 0) · TLS 1.3 via cert-manager / internal PKI</text>
<text x="1280.0" y="435.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">hostssl + scram only · pgaudit · encrypted StorageClass</text>
<text x="1280.0" y="451.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">roles wz_migrator / wz_app / wz_bff</text>
<rect x="930" y="500" width="340" height="95" rx="8" ry="8" fill="#EEF3F8" stroke="#1B365D" stroke-width="1.6"/>
<text x="1100.0" y="536.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B365D" text-anchor="middle">Barman Cloud plugin</text>
<text x="1100.0" y="554.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">WAL + daily base backups</text>
<text x="1100.0" y="570.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">S3-compatible store, 35 d PITR</text>
<rect x="1290" y="500" width="340" height="95" rx="8" ry="8" fill="#E7F0FA" stroke="#2E6DA4" stroke-width="1.6"/>
<text x="1460.0" y="536.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E6DA4" text-anchor="middle">HashiCorp Vault</text>
<text x="1460.0" y="554.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">CSI provider (pods)</text>
<text x="1460.0" y="570.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">External Secrets (CNPG roles)</text>
<rect x="930" y="615" width="700" height="80" rx="8" ry="8" fill="#FDF2E2" stroke="#B45309" stroke-width="1.6"/>
<text x="1280.0" y="652.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#B45309" text-anchor="middle">Clinical data at rest never leaves the data centre</text>
<text x="1280.0" y="670.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">only status-only projections and encrypted transport cross the link</text>
<rect x="40" y="600" width="760" height="120" rx="12" ry="12" fill="#FAFBFC" stroke="#AEB8C4" stroke-width="1.4" stroke-dasharray="8 5"/>
<text x="54" y="622" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="bold" fill="#5F6B7A" text-anchor="start">Private connectivity</text>
<rect x="70" y="640" width="700" height="60" rx="8" ry="8" fill="#FFFFFF" stroke="#AEB8C4" stroke-width="1.6"/>
<text x="420.0" y="668.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">ExpressRoute private peering / Cloud Interconnect / IPsec VPN (IKEv2, AES-256-GCM)</text>
<text x="420.0" y="684.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">only 443 from the BFF egress range to the internal API ingress</text>
<rect x="40" y="750" width="1620" height="125" rx="8" ry="8" fill="#FFFFFF" stroke="#AEB8C4" stroke-width="1.6"/>
<text x="50" y="783.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B365D" text-anchor="start">Why this split</text>
<text x="50" y="801.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="start">Data residency: PHI (cases, consents, audit) stays in the airline data centre under existing physical controls.</text>
<text x="50" y="818.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="start">Elastic, internet-facing tier stays in the cloud behind a managed WAF; it stores only encrypted session tokens.</text>
<text x="50" y="835.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="start">Same Helm chart and images everywhere; Arc / GKE Enterprise apply the same policies (PSS, Defender, GitOps).</text>
<text x="50" y="852.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="start">Proposed targets: RPO 0 (sync replica) / RTO &lt; 15 min on-prem node loss; DR site restore from object store &lt; 8 h.</text>
