<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="580" viewBox="0 0 1700 580" role="img" aria-label="Secrets flow">
<title>Secrets flow</title>
<defs><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6B7A"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6B7A"/></marker><marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6DA4"/></marker><marker id="sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6DA4"/></marker><marker id="egr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D4F"/></marker><marker id="sgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D4F"/></marker><marker id="en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B365D"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B365D"/></marker><marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="0" y="0" width="1700" height="54" fill="#1B365D"/>
<text x="24" y="34" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="start">Secrets flow - from vault to application property</text>
<text x="1676" y="34" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#C9D7E8" text-anchor="end">no static secrets in Git, images, values or etcd</text>
<rect x="40" y="90" width="330" height="200" rx="8" ry="8" fill="#E7F0FA" stroke="#2E6DA4" stroke-width="1.6"/>
<text x="205.0" y="161.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E6DA4" text-anchor="middle">Secret stores</text>
<text x="205.0" y="179.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">Azure Key Vault (RBAC, PE)</text>
<text x="205.0" y="196.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">GCP Secret Manager (CMEK)</text>
<text x="205.0" y="213.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">HashiCorp Vault (on-prem)</text>
<text x="205.0" y="230.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">local: .env (laptop only)</text>
<rect x="420" y="90" width="330" height="200" rx="8" ry="8" fill="#FFFFFF" stroke="#AEB8C4" stroke-width="1.6"/>
<text x="585.0" y="161.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B365D" text-anchor="middle">Workload identity</text>
<text x="585.0" y="179.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">Azure: federated credential</text>
<text x="585.0" y="196.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">GCP: KSA -&gt; GSA</text>
<text x="585.0" y="213.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">Vault: Kubernetes auth role</text>
<text x="585.0" y="230.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">one identity per component</text>
<rect x="800" y="90" width="330" height="200" rx="8" ry="8" fill="#E5F3EA" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="965.0" y="152.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D4F" text-anchor="middle">Secrets Store CSI driver</text>
<text x="965.0" y="170.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">SecretProviderClass per component</text>
<text x="965.0" y="187.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">read-only tmpfs volume</text>
<text x="965.0" y="204.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">/mnt/secrets/&lt;component&gt;/&lt;file&gt;</text>
<text x="965.0" y="221.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">(External Secrets on-prem)</text>
<text x="965.0" y="238.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">rotation (AKS 2 min)</text>
<rect x="1180" y="90" width="480" height="200" rx="8" ry="8" fill="#E5F3EA" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="1420.0" y="146.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2E7D4F" text-anchor="middle">Application (wz-secrets SecretValueResolver)</text>
<text x="1420.0" y="163.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">WZ_DB_PASSWORD=file:/mnt/secrets/core/wz-db-password</text>
<text x="1420.0" y="179.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">WZ_MASTER_KEY_FILE=/mnt/secrets/core/wz-master-key</text>
<text x="1420.0" y="195.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">ENC(...) values (AES-256-GCM, produced by EncryptCli)</text>
<text x="1420.0" y="211.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">decrypted with the vault-held master key</text>
<text x="1420.0" y="227.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">file: / ENC(...) for sensitive property names (core + bff)</text>
<text x="1420.0" y="243.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">clinical columns: EncryptedStringConverter (HKDF keys)</text>
<path d="M 372 190 L 418 190" fill="none" stroke="#2E6DA4" stroke-width="1.6" marker-end="url(#eb)"/>
<path d="M 752 190 L 798 190" fill="none" stroke="#2E6DA4" stroke-width="1.6" marker-end="url(#eb)"/>
<path d="M 1132 190 L 1178 190" fill="none" stroke="#2E7D4F" stroke-width="1.6" marker-end="url(#egr)"/>
<rect x="40" y="320" width="1620" height="230" rx="8" ry="8" fill="#FFFFFF" stroke="#AEB8C4" stroke-width="1.6"/>
<text x="50" y="372.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B365D" text-anchor="start">Rules</text>
<text x="50" y="390.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="start">1. Generated DB passwords: Terraform ephemeral values written with write-only arguments - never in state.</text>
<text x="50" y="407.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="start">2. Key material (WZ_MASTER_KEY, WZ_PSEUDONYM_KEY, BFF session key): openssl rand -base64 32, stored out-of-band.</text>
<text x="50" y="424.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="start">3. The BFF has its own session key and DB role - it never holds the core master key or clinical-schema access.</text>
<text x="50" y="441.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="start">4. In migrations.mode=job only the migrations identity can read wz-migrator-db-password.</text>
<text x="50" y="458.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="start">5. Database connector passwords never in plain config: file: reference or ENC(...) (tools/encrypt-secret.sh).</text>
<text x="50" y="475.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="start">6. Kubernetes Secret sync is off by default (secrets.syncToKubernetesSecret=false) - nothing in etcd.</text>
<text x="50" y="492.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="start">7. Separate vault, keys and identities per environment (dev / uat / prod) - nothing shared across stages.</text>
<text x="50" y="509.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="start">8. Every read is audited: Key Vault AuditEvent / Secret Manager Data Access logs / Vault audit device.</text>
</svg>
