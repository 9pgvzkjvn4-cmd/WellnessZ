<text x="1180.0" y="570.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E2933" text-anchor="middle">wz-core-app + wz-bff images from deploy/docker - read-only root FS, cap_drop ALL, uid 10001, tmpfs /tmp</text>
<rect x="40" y="650" width="1620" height="140" rx="8" ry="8" fill="#FDF2E2" stroke="#B45309" stroke-width="1.6"/>
<text x="850.0" y="691.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#B45309" text-anchor="middle">Secrets on the laptop</text>
<text x="850.0" y="709.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">./up.sh generates deploy/local/.env (mode 600, git-ignored) with random DB passwords, WZ_MASTER_KEY,</text>
<text x="850.0" y="726.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">WZ_PSEUDONYM_KEY and a separate WZ_BFF_MASTER_KEY (openssl rand).  Keycloak test users have temporary</text>
<text x="850.0" y="743.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">passwords (forced change).  Local-only placeholders (change-me-local-only) are allow-listed in gitleaks.</text>
<text x="850.0" y="760.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E2933" text-anchor="middle">Nothing from this setup is ever reused in a shared environment.</text>
