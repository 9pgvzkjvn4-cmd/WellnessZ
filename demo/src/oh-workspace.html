  // =====================================================================================
  // Render loop
  // =====================================================================================
  var router = UI.router(routes, { default: 'home' });
  function currentMatch() { var m = router.match(router.current()); return m && routes[m.key] ? m : { key: 'home', params: {} }; }
  function render(focus) {
    if (WZ.app !== 'oh') return;
    cache = {};
    var u = U();
    if (!u) { app.innerHTML = UI.h`<main class="wz-main">${UI.empty('No demo user', 'Choose a user in the demo toolbar.')}</main>`.toString(); return; }
    var m = currentMatch();
    var body;
    try { body = allowed(m.key) ? routes[m.key](m.params) : denied(m.key); }
    catch (e) { console.error(e); body = UI.alert('danger', 'Something went wrong', h`<p>${friendly(e)}</p>`); }
    var active = ACTIVE_NAV[m.key] || m.key;
    var scrollY = window.scrollY;
    app.innerHTML = h`${UI.header({ appName: 'OH Workspace', user: { name: u.name, title: u.title }, bell: WZ.unreadCount(), bellHref: '#/notifications' })}
      <div class="wz-layout">${sideNav(active)}
        <main class="wz-main oh-main" id="main" tabindex="-1">${body}
          <footer class="wz-footer">WellnessZ demo · synthetic data, all people are fictional · restricted content is hidden exactly as the engine returns it</footer></main></div>`.toString();
    ui.dirty = false; ui.pending = false; ui.lastUser = u.username;
    if (focus) { var h1 = app.querySelector('h1'); if (h1) h1.focus({ preventScroll: true }); window.scrollTo(0, 0); }
    else window.scrollTo(0, scrollY);
  }
  function resetUi() { ui.lastSelection = null; ui.lastTrace = null; ui.lastFollowUp = null; ui.queueQ = ''; ui.queueCode = ''; ui.auditOutcome = ''; ui.auditQ = ''; }

  window.addEventListener('hashchange', function () { ui.dirty = false; render(true); });
  WZ.subscribe(function (evt) {
    if (evt && (evt.type === 'reset' || evt.type === 'import')) { try { localStorage.removeItem(HANDOFF_KEY); } catch (e) { /* storage blocked */ } }
    if (WZ.app !== 'oh') return;
    var u = U();
    if (u && ui.lastUser && u.username !== ui.lastUser) {
      resetUi(); ui.dirty = false;
      if (!allowed(currentMatch().key)) { location.hash = '#/home'; return; }
      render(true); return;
    }
    if (ui.dirty) { ui.pending = true; return; }   // do not wipe a form the user is filling in
    render(false);
  });
  app.addEventListener('input', function (e) { var f = e.target.closest('form[data-form]'); if (f && f.getAttribute('data-form').indexOf('filter-') !== 0) ui.dirty = true; });

  // ---------------------------------------------------------------- form handling
  function showError(form, msg) {
    var p = form.querySelector('[data-error]');
    if (p) { p.textContent = msg; p.hidden = false; }
    UI.toast(msg, 'danger');
  }
  /** Run an engine action; on success toast and re-render, on failure show a friendly message in the form. */
  function run(form, fn, ok, after) {
    var r;
    try { r = fn(); } catch (e) { if (form) showError(form, friendly(e)); else UI.toast(friendly(e), 'danger'); return undefined; }
    ui.dirty = false;
    if (ok) UI.toast(typeof ok === 'function' ? ok(r) : ok, 'success');
    if (after) after(r); else render(false);
    return r === undefined ? true : r;
  }
  function num(v) { return v === '' || v == null ? undefined : Number(v); }

  app.addEventListener('change', function (e) {
    var f = e.target.closest('form[data-form]'); if (!f) return;
    var kind = f.getAttribute('data-form');
    if (kind === 'filter-diary') { var d = UI.formData(f); ui.diarySite = d.site; ui.diaryType = d.type; render(false); }
    if (kind === 'filter-queue' && e.target.name === 'queue') { ui.queueCode = e.target.value; render(false); }
    if (kind === 'filter-audit' && e.target.name === 'outcome') { ui.auditOutcome = e.target.value; render(false); }
    if (kind === 'filter-emp' && e.target.name === 'safety') { ui.empSafety = e.target.checked; render(false); }
    if (kind === 'triage' && e.target.name === 'protocol') {
      var p = refList('triageProtocols').filter(function (x) { return x.code === e.target.value; })[0];
      if (p) { var r = f.querySelector('input[name="urgency"][value="' + p.defaultUrgency + '"]'); if (r) r.checked = true; }
    }
  });

  app.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-form]'); if (!f) return;
    e.preventDefault();
    var kind = f.getAttribute('data-form'), id = f.getAttribute('data-id'), d = UI.formData(f);
    switch (kind) {
      case 'filter-queue': ui.queueQ = d.q || ''; ui.queueCode = d.queue || ''; render(false); break;
      case 'filter-emp': ui.empQ = d.q || ''; ui.empSafety = !!d.safety; render(false); break;
      case 'filter-audit': ui.auditQ = d.q || ''; ui.auditOutcome = d.outcome || ''; render(false); break;
      case 'assign': run(f, function () { return WZ.assign(id, d.assignee); }, 'Case owner updated'); break;
      case 'close-case':
        if (!d.reason.trim()) return showError(f, 'Give a reason for closing the case.');
        run(f, function () { return WZ.closeCase(id, { reason: d.reason.trim() }); }, 'Case closed'); break;
      case 'triage':
        run(f, function () { return WZ.triage(id, { urgency: d.urgency, protocol: d.protocol || undefined, queue: d.queue || undefined, recordable: !!d.recordable, answers: d.redFlags ? { redFlags: d.redFlags } : {}, note: d.note || undefined }); }, 'Triage saved', function () { location.hash = '#/case/' + id + '?tab=overview'; });
        break;
      case 'note':
        if (!d.text.trim()) return showError(f, 'The note is empty.');
        run(f, function () { return WZ.addCaseNote(id, d.text, d.share ? 'SELF' : 'OH'); }, 'Note added'); break;
      case 'fitness':
        if (!d.status) return showError(f, 'Choose a fitness outcome.');
        run(f, function () { return WZ.recordFitnessDecision(id, { status: d.status, reviewDate: d.status === 'FIT' ? null : (d.reviewDate || null), note: d.note || '', restrictions: d.status === 'FIT' ? [] : collectRestrictions(f) }); }, 'Fitness decision recorded – the manager sees status and restrictions only'); break;
      case 'restrictions':
        run(f, function () { return WZ.setRestrictions(id, collectRestrictions(f), { until: d.until || null }); }, 'Restrictions updated'); break;
      case 'rtw':
        var phases = [1, 2, 3, 4].map(function (w) { return { week: num(d['week' + w]), hours: d['hours' + w], duties: (d['duties' + w] || '').trim() }; }).filter(function (p) { return p.duties; });
        if (!phases.length) return showError(f, 'Describe the duties for at least one week.');
        run(f, function () { return WZ.createRtwPlan(id, { goal: d.goal, startDate: d.startDate, reviewDate: d.reviewDate, phases: phases }); }, function (r) { return 'Plan ' + r.id + ' issued – the employee and line manager are asked to acknowledge it'; }); break;
      case 'treatment':
        if (!lines(d.goals).length) return showError(f, 'Add at least one goal.');
        run(f, function () { return WZ.createTreatmentPlan(id, { goals: lines(d.goals), interventions: lines(d.interventions), expectedRecoveryDays: num(d.days) || 28, followUps: [d.fu1, d.fu2].filter(Boolean) }); }, 'Treatment plan started'); break;
      case 'partner-referral':
        var sv = (d.service || '').split('|');
        run(f, function () { return WZ.sendPartnerReferral({ caseId: id, partnerOrg: sv[0], service: sv[1], urgency: d.urgency, question: d.question, dataSet: checked(f, 'dataSet'), consent: !!d.consent }); }, function (r) { return 'Referral ' + r.id + ' sent to ' + r.partnerName; }); break;
      case 'book-case':
        run(f, function () { return WZ.bookAppointment({ slotId: d.slotId, employeeId: f.getAttribute('data-emp'), caseId: id, reason: d.reason || 'Case review' }); }, 'Appointment booked'); break;
      case 'ame-relief':
        if (!d.ref.trim()) return showError(f, 'Enter the confidential case reference from the named clinician.');
        run(f, function () { return WZ.recordSupportFitness(d.ref.trim(), { status: d.status, reviewDate: d.reviewDate || null }); }, 'Aviation fitness recorded – crew scheduling sees the status only', function () {
          var ho = readHandoff(); delete ho[f.getAttribute('data-emp')]; writeHandoff(ho); render(false); }); break;
      case 'advice':
        if (!d.workImpact.trim()) return showError(f, 'Describe the work impact.');
        run(f, function () { return WZ.writeAdviceReport(id, { fitness: d.fitness, workImpact: d.workImpact, adjustments: d.adjustments, likelyReturn: d.likelyReturn, review: d.review || null }); }, 'Report sent to the employee for review'); break;
      case 'callback':
        if (!d.outcome) return showError(f, 'Choose the outcome of the call.');
        run(f, function () { return WZ.recordCallback(id, f.getAttribute('data-item'), { outcome: d.outcome, note: d.note }); }, 'Call-back recorded'); break;
      case 'support-note':
        if (!d.text.trim()) return showError(f, 'The note is empty.');
        run(f, function () { return WZ.addSupportNote(id, d.text); }, 'Note added'); break;
      case 'eap':
        run(f, function () { return WZ.sendPartnerReferral({ supportCaseId: id, partnerOrg: 'EAP_WELLBEING', service: 'EAP_COUNSELLING', consent: !!d.consent }); }, 'EAP referral sent – name and contact preference only'); break;
      case 'support-fitness':
        run(f, function () { return WZ.recordSupportFitness(id, { status: d.status, reviewDate: d.reviewDate || null }); }, 'Fitness recorded'); break;
      case 'support-close':
        if (!d.reason.trim()) return showError(f, 'Give a reason.');
        run(f, function () { return WZ.closeSupportCase(id, d.reason.trim()); }, 'Support case closed'); break;
      case 'peer-log':
        run(f, function () { return WZ.peerLogContact(id, { category: d.category, outcome: d.outcome }); }, 'Contact logged'); break;
      case 'random':
        run(f, function () { return WZ.randomSelection(d.poolId, { count: num(d.count) || 1, panel: d.panel }); }, null, function (r) { ui.lastSelection = r; UI.toast('Selected: ' + r.selectedNames.join(', '), 'success'); render(false); }); break;
      case 'for-cause':
        run(f, function () { return WZ.forCauseRequest({ employeeId: d.employeeId.trim().toUpperCase(), observations: lines(d.observations), location: d.location }); }, 'Collector dispatched'); break;
      case 'collect':
        run(f, function () { return WZ.collectSpecimen(id, { specimenId: d.specimenId || undefined, ccf: d.ccf || undefined, seals: d.seals, breathAlcohol: d.breathAlcohol, temperatureOk: !!d.temperatureOk, breathOnly: !!d.breathOnly, refusal: d.refusal || undefined }); }, function (r) { return 'Collection recorded – ' + r.statusLabel.toLowerCase(); }); break;
      case 'lab':
        run(f, function () { return WZ.labResult(id, { result: d.result, analyte: d.result === 'NON_NEGATIVE' ? d.analyte : null }); }, 'Laboratory result received – awaiting MRO verdict'); break;
      case 'verdict':
        run(f, function () { return WZ.mroVerdict(id, { outcome: d.outcome, note: d.note }); }, function (r) { return 'Verdict recorded: ' + WZ.label('test', r.status).toLowerCase(); }); break;
      case 'travel':
        run(f, function () { return WZ.completeTravelConsultation(id, { recommendations: checked(f, 'rec'), vaccinesGiven: checked(f, 'vax'), certificate: !!d.certificate }); }, 'Consultation completed'); break;
      case 'advisory':
        run(f, function () { return WZ.publishAdvisory({ destination: d.destination, title: d.title, body: d.body, severity: d.severity, withinDays: num(d.withinDays) || 14 }); }, function (r) { return 'Advisory sent to ' + r.recipientCount + ' rostered crew'; }); break;
      case 'cd-open':
        if (!d.employeeId) return showError(f, 'Choose the employee.');
        run(f, function () { return WZ.openCommunicableCase({ employeeId: d.employeeId, condition: d.condition, onsetDate: d.onsetDate, exclusionDays: num(d.exclusionDays), incubationDays: num(d.incubationDays) }); }, 'Case opened – employee excluded', function (r) { location.hash = '#/communicable/' + r.id; }); break;
      case 'trace':
        run(f, function () { return WZ.contactTrace(id, { windowDays: num(d.windowDays) || 7 }); }, null, function (r) { ui.lastTrace = r; UI.toast(r.contactsCreated + ' contact(s) identified', 'success'); render(false); }); break;
      case 'campaign-invite':
        run(f, function () { return WZ.campaignInvite(id, { units: checked(f, 'units') }); }, function (r) { return r.invitedAdded + ' invited (in-app)'; }); break;
      case 'campaign-new':
        run(f, function () { return WZ.createCampaign({ title: d.title, type: d.type, description: d.description, start: d.start, end: d.end, screeningType: d.type === 'SCREENING' ? 'BIOMETRIC' : null, events: d.eventDate ? [{ id: 'EVT-' + Date.now().toString(36).toUpperCase(), date: d.eventDate, site: 'HUB', location: d.eventLocation || 'Hub clinic', capacity: num(d.capacity) || 30 }] : [] }); }, 'Campaign created'); break;
      case 'screening':
        if (!d.employeeId) return showError(f, 'Choose the employee.');
        run(f, function () { return WZ.screeningResult({ campaignId: d.campaignId, employeeId: d.employeeId, measures: { systolic: num(d.systolic), diastolic: num(d.diastolic), cholesterol: num(d.cholesterol), bmi: num(d.bmi) } }); }, function (r) { return r.outcome === 'ABNORMAL' ? 'Abnormal – letter issued and follow-up case ' + r.followUpCaseId + ' opened' : 'Normal – result letter issued'; }); break;
      case 'ergo-new':
        run(f, function () { return WZ.addErgonomicAction({ unit: d.unit, area: d.area, assessment: d.assessment, rag: d.rag, finding: d.finding, action: d.action, owner: d.owner, due: d.due }); }, 'Action added; the unit manager is notified'); break;
      case 'ergo-status':
        run(f, function () { return WZ.updateErgonomicAction(id, { status: d.status }); }, 'Status updated'); break;
      case 'claim-open':
        run(f, function () { return WZ.openClaim({ caseId: d.caseId.trim(), payerOrg: d.payerOrg, type: d.type, lostTimeDays: num(d.lostTimeDays) || 0, reserve: num(d.reserve) || 0, consent: !!d.consent }); }, function (r) { return 'Claim ' + r.id + ' submitted'; }); break;
      case 'claim-msg':
        if (!d.text.trim()) return showError(f, 'The message is empty.');
        run(f, function () { return WZ.claimMessage(id, d.text); }, 'Message sent'); break;
      case 'claim-close':
        run(f, function () { return WZ.closeClaim(id, d.reason); }, 'Claim closed'); break;
      case 'bg-review':
        run(f, function () { return WZ.reviewBreakGlass(id, { outcome: d.outcome }); }, 'Review recorded'); break;
    }
  });

  // ---------------------------------------------------------------- click actions
  UI.on(app, 'click', '[data-act]', function (e, el) {
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    if (act === 'read') { WZ.markNotificationRead(id); }
    else if (act === 'open-note') { WZ.markNotificationRead(id); }
    else if (act === 'read-all') { WZ.markAllRead(); }
    else if (act === 'queue-clear') { ui.queueQ = ''; ui.queueCode = ''; render(false); }
    else if (act === 'audit-clear') { ui.auditQ = ''; ui.auditOutcome = ''; if (location.hash.indexOf('?') >= 0) location.hash = '#/privacy/audit'; else render(false); }
    else if (act === 'surv-filter') { e.preventDefault(); ui.survAll = el.getAttribute('data-all') === '1'; render(false); }
    else if (act === 'assign-me') { run(null, function () { return WZ.assign(id, U().username); }, 'Assigned to you'); }
    else if (act === 'assign') {
      var oh = users().filter(function (x) { return isOHTeam(x) && x.roles.indexOf('PSYCH_CLINICIAN') < 0; });
      UI.modal({ title: 'Assign ' + id, body: h`<form class="wz-form"><div class="wz-field"><label for="m-assignee">Case owner</label><select id="m-assignee" name="assignee">${oh.map(function (x) { return opt(x.username, x.name + ' – ' + x.title, ''); })}</select></div></form>`,
        actions: [{ label: 'Cancel', tone: 'secondary' }, { label: 'Assign', onClick: function (close, dlg) { var v = dlg.querySelector('[name=assignee]').value; return run(null, function () { return WZ.assign(id, v); }, 'Assigned to ' + userName(v)) ? undefined : false; } }] });
    }
    else if (act === 'cancel-appt') {
      UI.confirm('Cancel appointment?', 'The slot is released and the clinician is told.', 'Cancel appointment', 'danger').then(function (ok) { if (ok) run(null, function () { return WZ.cancelAppointment(id, 'Cancelled by OH'); }, 'Appointment cancelled'); });
    }
    else if (act === 'book-slot') {
      var slot = WZ.list('clinicSlots', { all: true }).filter(function (s) { return s.id === id; })[0];
      if (!slot) return;
      UI.modal({ title: 'Book ' + WZ.label('slot', slot.type).toLowerCase(), body: h`${UI.dl([['When', UI.fmtDateTime(slot.start)], ['Where', slot.site + ' clinic'], ['With', slot.clinicianName]])}
        <form class="wz-form" style="margin-top:1rem"><div class="wz-field"><label for="m-emp">Employee</label><select id="m-emp" name="employeeId">${employees().map(function (x) { return opt(x.id, x.name + ' (' + x.id + ')', ''); })}</select></div>
        ${UI.field({ name: 'reason', id: 'm-reason', label: 'Reason', value: WZ.label('slot', slot.type) })}${UI.field({ name: 'caseId', id: 'm-case', label: 'Case reference', optional: true })}</form>`,
        actions: [{ label: 'Back', tone: 'secondary' }, { label: 'Book appointment', onClick: function (close, dlg) {
          var v = { slotId: id, employeeId: dlg.querySelector('[name=employeeId]').value, reason: dlg.querySelector('[name=reason]').value, caseId: dlg.querySelector('[name=caseId]').value.trim() || undefined };
          return run(null, function () { return WZ.bookAppointment(v); }, 'Appointment booked; the employee is notified') ? undefined : false; } }] });
    }
    else if (act === 'break-glass') {
      UI.modal({ title: 'Emergency access (break-glass)', body: h`${UI.alert('danger', 'Use only in an emergency', h`<p>You will get read-only access to this employee's restricted records for ${cfg().breakGlassHours} hours. The data protection officer is alerted immediately and reviews every use.</p>`)}
        <form class="wz-form">${UI.field({ type: 'textarea', name: 'justification', id: 'm-just', label: 'Clinical justification', required: true, hint: 'At least 10 characters, for example the emergency and why the record is needed now.' })}</form>`,
        actions: [{ label: 'Cancel', tone: 'secondary' }, { label: 'Open restricted records', tone: 'danger', onClick: function (close, dlg) {
          var j = dlg.querySelector('[name=justification]').value;
          return run(null, function () { return WZ.breakGlass(id, j); }, 'Break-glass access granted – the DPO has been alerted') ? undefined : false; } }] });
    }
    else if (act === 'ame-handoff') {
      var ho = readHandoff(); ho[el.getAttribute('data-emp')] = { ref: id, at: nowIso(), by: U().username };
      if (writeHandoff(ho)) { UI.toast('Reference ' + id + ' shared with the AME (reference only – no content)', 'success'); render(false); }
      else UI.toast('Could not save the hand-off in this browser. Give the AME the reference ' + id + ' directly.', 'warn');
    }
    else if (act === 'ei-refer') { run(null, function () { return WZ.raiseEarlyIntervention(id, { referToOh: true }); }, function (r) { return 'Case ' + r.caseId + ' and advice request ' + r.adviceRequestId + ' opened'; }); }
    else if (act === 'ei-monitor') { run(null, function () { return WZ.raiseEarlyIntervention(id, { referToOh: false }); }, 'Set to monitor'); }
    else if (act === 'advice-onbehalf') {
      UI.confirm('Release after the review window?', 'Use this only when the employee has not responded within the agreed review window. The report goes to HR and the line manager and the disclosure is logged.', 'Release report').then(function (ok) { if (ok) run(null, function () { return WZ.releaseAdvice(id, { onBehalf: true }); }, 'Report released'); });
    }
    else if (act === 'cert') { run(null, function () { return WZ.validateCertificate(id, el.getAttribute('data-status')); }, 'Certificate ' + el.getAttribute('data-status').toLowerCase()); }
    else if (act === 'surv-invite') { run(null, function () { return WZ.inviteSurveillance(id); }, 'Invitation sent – the employee is asked to book'); }
    else if (act === 'surv-result') {
      UI.modal({ title: 'Record result – ' + el.getAttribute('data-prog'), body: h`<p>${el.getAttribute('data-name')}</p><form class="wz-form">${UI.radios({ name: 'outcome', legend: 'Outcome', value: 'NORMAL', options: [{ value: 'NORMAL', label: 'Normal' }, { value: 'ABNORMAL', label: 'Abnormal – follow up' }] })}${UI.field({ type: 'textarea', name: 'summary', id: 'm-summary', label: 'Summary' })}</form>`,
        actions: [{ label: 'Cancel', tone: 'secondary' }, { label: 'Save result', onClick: function (close, dlg) {
          var o = dlg.querySelector('[name=outcome]:checked').value, s = dlg.querySelector('[name=summary]').value;
          return run(null, function () { return WZ.recordSurveillanceResult(id, { outcome: o, summary: s }); }, o === 'NORMAL' ? 'Result recorded – next due date set and letter issued' : 'Result recorded – follow-up case opened', function (r) { ui.lastFollowUp = r.followUpCaseId; render(false); }) ? undefined : false; } }] });
    }
    else if (act === 'rtd') {
      var fin = el.getAttribute('data-final') === '1';
      UI.confirm(fin ? 'Final return to duty?' : 'Return to duty pending?', fin ? 'The employee becomes available for safety-sensitive duty and fit. HR and the manager get a status-only notice.' : 'The employee may return under a follow-up testing plan. HR and the manager get a status-only notice.', 'Confirm').then(function (ok) {
        if (ok) run(null, function () { return WZ.returnToDuty(id, { final: fin }); }, function (r) { return 'Duty status: ' + WZ.label('duty', r.dutyStatus).toLowerCase(); }); });
    }
    else if (act === 'clear-contact') { run(null, function () { return WZ.clearContact(id); }, 'Contact cleared'); }
    else if (act === 'ph-report') { run(null, function () { return WZ.reportPublicHealth(id); }, 'Reported to the local health protection team'); }
    else if (act === 'doc') {
      var doc = WZ.list('documents', { employeeId: el.getAttribute('data-emp') }).filter(function (x) { return x.id === id; })[0];
      if (!doc) return UI.toast('Document not available', 'danger');
      UI.modal({ title: doc.title, body: h`<div class="wz-letter"><p><strong>WellnessZ Occupational Health</strong><br><span class="wz-small">${UI.fmtDate(doc.createdAt)} · ${doc.id}</span></p><p>Employee: ${doc.employeeName}</p><p>${doc.body || 'This document is held in the occupational health record (demo: no file content).'}</p><p>Issued by ${doc.byName}</p></div>`, actions: [{ label: 'Close' }] });
    }
  });

  render(true);
})();
</script>
</body>
</html>
