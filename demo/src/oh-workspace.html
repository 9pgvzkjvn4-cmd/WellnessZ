<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="WellnessZ OH Clinical Workspace – offline demo with synthetic data">
<title>WellnessZ – OH Clinical Workspace (demo)</title>
<link rel="stylesheet" href="../shared/ui.css" data-wz-inline>
<style>
  .wz-main h1 { color: var(--c-primary); }
  .wz-main h1.wz-mono { font-size: 1.5rem; letter-spacing: .01em; }
  .wz-header-in { max-width: none; padding-left: 1.25rem; padding-right: 1.25rem; }
  .wz-table .wz-mono, .wz-card-title { white-space: nowrap; }
  .wz-layout { min-height: calc(100vh - 100px); }
  .wz-side .oh-nav-n { float: right; font-size: .72rem; padding: 0 .45rem; }
  .oh-main { max-width: 1240px; width: 100%; min-width: 0; }
  .oh-sub { color: var(--c-muted); margin: -.2rem 0 1rem; }
  .oh-tabs { display: flex; flex-wrap: wrap; gap: .1rem; border-bottom: 1px solid var(--c-border); margin: 1.1rem 0 1rem; }
  .oh-tabs a { padding: .6rem .8rem; text-decoration: none; color: var(--c-text); border-bottom: 3px solid transparent; margin-bottom: -1px; font-weight: 500; white-space: nowrap; }
  .oh-tabs a:hover { background: var(--c-surface-2); }
  .oh-tabs a[aria-current="page"] { border-bottom-color: var(--c-primary); color: var(--c-primary); font-weight: 650; }
  .oh-pills { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
  .oh-pills a { display: inline-flex; gap: .5rem; align-items: center; border: 1px solid var(--c-border); background: var(--c-surface); border-radius: var(--radius-sm); padding: .45rem .9rem; text-decoration: none; color: var(--c-text); font-weight: 600; }
  .oh-pills a:hover { border-color: var(--c-primary); }
  .oh-pills a[aria-current="page"] { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }
  .oh-pills .n { background: var(--c-surface-2); color: var(--c-text); border-radius: 999px; padding: 0 .5rem; font-size: .85rem; }
  .oh-pills a[aria-current="page"] .n { background: #fff; color: var(--c-primary); }
  .oh-pills .n.hot { background: var(--c-error-bg); color: var(--c-error); }
  .oh-badges { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
  .oh-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem 1rem; margin-top: .75rem; }
  .oh-meta small { display: block; text-transform: uppercase; letter-spacing: .06em; font-size: .72rem; color: var(--c-muted); }
  .oh-filter { display: flex; flex-wrap: wrap; gap: .75rem; align-items: flex-end; }
  .oh-filter .wz-field { min-width: 170px; flex: 0 1 220px; }
  .oh-filter .wz-field.grow { flex: 1 1 260px; }
  .oh-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: .4rem .9rem; }
  .oh-checks .wz-check { font-size: .95rem; }
  .oh-phase { display: grid; grid-template-columns: 70px minmax(120px, 1fr) 2fr; gap: .5rem; align-items: end; }
  .oh-two { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); align-items: start; }
  .oh-three { display: grid; gap: .9rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); align-items: start; }
  .oh-kpis { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); margin-bottom: 1rem; }
  .oh-kpis a.wz-kpi { text-decoration: none; color: inherit; }
  .oh-kpis a.wz-kpi:hover { border-color: var(--c-primary); }
  .oh-kpi-hot b { color: var(--c-error); }
  .oh-day { margin-bottom: 1rem; }
  .oh-day h3 { margin: 0 0 .4rem; font-size: .95rem; color: var(--c-muted); text-transform: uppercase; letter-spacing: .05em; }
  .oh-slot { display: grid; grid-template-columns: 60px 1fr auto; gap: .6rem; align-items: center; padding: .45rem 0; border-bottom: 1px solid var(--c-border); }
  .oh-slot:last-child { border-bottom: 0; }
  .oh-slot time { font-weight: 700; font-variant-numeric: tabular-nums; }
  .oh-note { border-left: 3px solid var(--c-border); padding: .1rem 0 .1rem .7rem; margin-bottom: .7rem; }
  .oh-note small { display: block; color: var(--c-muted); }
  .oh-hash { font-family: var(--mono); font-size: .8rem; color: var(--c-muted); }
  .oh-inline-form { display: flex; flex-wrap: wrap; gap: .5rem; align-items: flex-end; }
  .oh-inline-form .wz-field { flex: 1 1 200px; }
  .wz-card h2 { margin-top: 0; font-size: 1.08rem; }
  .wz-card h3:first-child { margin-top: 0; }
  details.oh-more > summary { cursor: pointer; color: var(--c-primary); font-weight: 600; margin: .3rem 0; }
  .wz-table td .wz-btn.small, .wz-table td .wz-actions { white-space: nowrap; }
  .wz-table td .wz-actions { margin-top: 0; flex-wrap: nowrap; }
  .oh-fatal { max-width: 560px; margin: 3rem auto; padding: 1rem; }
  .oh-quick { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
  @media (max-width: 860px) { .wz-side .oh-nav-n { float: none; } .oh-phase { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<a class="wz-skip" href="#main">Skip to content</a>
<div class="wz-app" id="app" aria-live="off"></div>

<script src="../data/demo-data.js" data-wz-data></script>
<script src="../shared/scenarios.js" data-wz-inline></script>
<script src="../shared/engine.js" data-wz-inline></script>
<script src="../shared/ui.js" data-wz-inline></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  if (!window.WZ_DEMO_SEED || !window.WZ) {
    app.innerHTML = '<div class="oh-fatal"><div class="wz-alert danger"><div class="wz-alert-title">Demo data not found</div><p>The file <code>demo-data.js</code> must be in the same folder as this app. Open the app from the demo folder (for example via <code>index.html</code>) in Chrome or Edge.</p></div></div>';
    return;
  }
  var h = UI.h, raw = UI.raw;
  WZ.init({ app: 'oh' });

  // ---------------------------------------------------------------- local UI state (not part of the session)
  var ui = { dirty: false, pending: false, lastUser: null, queueQ: '', queueCode: '', empQ: '', empSafety: false, survAll: false,
    diarySite: 'HUB', diaryType: '', auditOutcome: '', auditQ: '', lastSelection: null, lastTrace: null, lastFollowUp: null };
  var HANDOFF_KEY = 'wellnessz-oh-ame-handoff';   // app-local hand-off from the named clinician to the AME (reference only)

  // ---------------------------------------------------------------- reference labels
  var QUEUE_LABEL = { INTAKE: 'Intake', OH_NURSE: 'OH nurse', PHYSICIAN: 'Physician', AEROMEDICAL: 'Aeromedical (AME)', FOOD_SAFETY: 'Food safety', CASE_MANAGEMENT: 'Case management', MENTAL_HEALTH: 'Mental health (restricted)', MRO: 'MRO (restricted)' };
  var URGENCIES = ['EMERGENCY', 'URGENT', 'SEMI_URGENT', 'ROUTINE', 'ADVICE'];
  var URG_RANK = { EMERGENCY: 0, URGENT: 1, SEMI_URGENT: 2, ROUTINE: 3, ADVICE: 4 };
  var FITNESS_OUTCOMES = ['FIT', 'FIT_WITH_RESTRICTIONS', 'TEMPORARILY_UNFIT', 'PERMANENTLY_UNFIT'];
  var MRO_OUTCOMES = [
    { value: 'NEGATIVE', label: 'Negative' }, { value: 'NEGATIVE_LEGITIMATE_PRESCRIPTION', label: 'Negative – legitimate prescription' },
    { value: 'POSITIVE', label: 'Verified positive' }, { value: 'POSITIVE_DILUTE', label: 'Positive (dilute)' },
    { value: 'REFUSAL_ADULTERATED', label: 'Refusal – adulterated' }, { value: 'REFUSAL_SUBSTITUTED', label: 'Refusal – substituted' }, { value: 'CANCELLED', label: 'Cancelled (fatal flaw)' }];
  var ANALYTES = ['Cannabinoids (demo)', 'Opiates (demo)', 'Amphetamines (demo)', 'Cocaine metabolites (demo)', 'Benzodiazepines (demo)'];
  var PEER_CATEGORIES = [{ value: 'WORK_STRESS', label: 'Work stress' }, { value: 'FATIGUE', label: 'Fatigue' }, { value: 'CRITICAL_INCIDENT', label: 'Critical incident' }, { value: 'RELATIONSHIPS', label: 'Relationships / home' }, { value: 'GENERAL', label: 'General' }];
  var PEER_OUTCOMES = [{ value: 'SUPPORTED', label: 'Supported' }, { value: 'REFERRED', label: 'Referred on (EAP / OH)' }, { value: 'NO_CONTACT', label: 'No contact made' }];
  var DATA_SET = ['Referral question', 'Work demands (job profile)', 'Relevant history', 'Imaging and test results'];
  var ERR_TITLE = {
    forbidden: 'Not allowed for your role', not_found: 'Not available to you', validation: 'Please check the form', invalid_state: 'Not possible at this stage',
    consent_required: 'Consent is needed', consent_withdrawn: 'Consent has been withdrawn', slot_taken: 'That slot has just been taken', closure_guard: 'Fitness decision needed first',
    urgent_open: 'An urgent item is still open', relief_active: 'Relief from duties is still active', case_closed: 'This case is closed', clinical_content: 'Practical wording only',
    storage_full: 'The browser could not save the demo', unauthenticated: 'Nobody is signed in', invalid_file: 'Not a demo session file'
  };

  // ---------------------------------------------------------------- helpers
  function U() { return WZ.currentUser; }
  function can(p) { var u = U(); return !!u && WZ.can(u, p); }
  function canAny(ps) { return ps.some(can); }
  function hasRole(r) { var u = U(); return !!u && u.roles.indexOf(r) >= 0; }
  function isOHTeam(u) { u = u || U(); return !!u && u.roles.some(function (r) { return WZ.OH_TEAM.indexOf(r) >= 0; }); }
  function cfg() { return WZ.ref('config'); }
  function isNamed() { var c = cfg(); return hasRole('PSYCH_CLINICIAN') && (!c.namedClinicians.length || c.namedClinicians.indexOf(U().username) >= 0); }
  function isMro() { return hasRole('MRO') || (hasRole('OH_PHYSICIAN') && (cfg().actingMroPhysicians || []).indexOf(U().username) >= 0); }
  function query() { var q = (location.hash.split('?')[1] || ''); var o = {}; q.split('&').forEach(function (p) { if (!p) return; var kv = p.split('='); o[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); }); return o; }
  function friendly(e) {
    if (e && e.name === 'WZError') { var t = ERR_TITLE[e.code] || 'Could not complete this'; return e.message && e.message !== e.code ? t + ': ' + e.message : t + '.'; }
    return 'Something went wrong: ' + ((e && e.message) || e);
  }
  function rid(x) { return x || '—'; }
  function nowIso() { return new Date().toISOString(); }
  var cache = {};
  function users() { return cache.users || (cache.users = WZ.users()); }
  function userName(un) { if (!un) return '—'; if (un === 'system') return 'System'; var x = users().filter(function (u) { return u.username === un; })[0]; return x ? x.name : un; }
  function employees() { return cache.emps || (cache.emps = WZ.list('employees')); }
  function empName(id) { var e = employees().filter(function (x) { return x.id === id; })[0]; return e ? e.name : id; }
  function refList(name) { cache['ref:' + name] = cache['ref:' + name] || WZ.ref(name); return cache['ref:' + name]; }
  function safetyRole(code) { return refList('safetyRoles').filter(function (r) { return r.code === code; })[0] || null; }
  function isCrewCode(code) { return code === 'PILOT' || code === 'CABIN_CREW'; }
  function unitName(id) { var o = refList('orgUnits').filter(function (x) { return x.id === id; })[0]; return o ? o.name : id; }
  function dest(code) { return refList('destinations').filter(function (d) { return d.code === code; })[0] || { code: code, name: code, vaccines: [], advice: [], risks: [] }; }
  function partnerName(code) { var o = refList('partnerOrgs').filter(function (x) { return x.code === code; })[0]; return o ? o.name : code; }
  function caseLink(id) { return id ? (canOpenCase() ? h`<a class="wz-mono" href="#/case/${id}">${id}</a>` : h`<span class="wz-mono">${id}</span>`) : '—'; }
  function canOpenCase() { return can('case.read') || can('support.clinical') || isMro(); }
  function empLink(id, name) { return can('case.read') ? h`<a href="#/employee/${id}">${name || empName(id)}</a>` : (name || empName(id)); }
  function heading(title, sub, extra) { return h`<div class="wz-page-head"><div><h1 tabindex="-1">${title}</h1>${sub ? h`<p class="wz-lead" style="margin:0">${sub}</p>` : ''}</div><span class="wz-sp"></span>${extra || ''}</div>`; }
  function card(title, body, extra) { return h`<section class="wz-card">${title ? h`<div class="wz-card-head"><h2 style="margin:0">${title}</h2>${extra || ''}</div>` : ''}${body}</section>`; }
  function kpi(n, label, href, hot) { var inner = h`<b>${n == null ? '—' : n}</b><span>${label}</span>`; return href ? h`<a class="wz-kpi ${hot && n ? 'oh-kpi-hot' : ''}" href="#/${href}">${inner}</a>` : h`<div class="wz-kpi ${hot && n ? 'oh-kpi-hot' : ''}">${inner}</div>`; }
  function opt(value, label, selected) { return h`<option value="${value}" ${raw(String(value) === String(selected) ? 'selected' : '')}>${label}</option>`; }
  function checks(name, items, selected) { selected = selected || []; return h`<div class="oh-checks">${items.map(function (it) { it = typeof it === 'string' ? { value: it, label: it } : it; return h`<label class="wz-check"><input type="checkbox" name="${name}" value="${it.value}" ${raw(selected.indexOf(it.value) >= 0 ? 'checked' : '')}><span>${it.label}</span></label>`; })}</div>`; }
  function checked(form, name) { return Array.prototype.filter.call(form.querySelectorAll('input[name="' + name + '"]'), function (i) { return i.checked; }).map(function (i) { return i.value; }); }
  function lines(text) { return String(text || '').split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean); }
  function visBadge(v) { return v === 'OH' ? UI.badge('OH only', 'neutral') : v === 'SELF' ? UI.badge('Shared with employee', 'info') : v === 'RESTRICTED' ? UI.badge('Restricted', 'restricted') : UI.badge('Status', 'success'); }
  function urgencyBadge(u) { return u ? UI.status('urgency', u) : UI.badge('Not triaged', 'neutral'); }
  function priorityBadge(p) { return p === 'URGENT' ? UI.badge('Urgent', 'danger') : p === 'HIGH' ? UI.badge('High', 'warn') : UI.badge('Normal', 'neutral'); }
  function ragBadge(r) { return UI.badge(r === 'RED' ? 'Red' : r === 'GREEN' ? 'Green' : 'Amber', r === 'RED' ? 'danger' : r === 'GREEN' ? 'success' : 'warn'); }
  function errorBox() { return raw('<p class="wz-error" data-error hidden></p>'); }
  function readHandoff() { try { return JSON.parse(localStorage.getItem(HANDOFF_KEY) || '{}') || {}; } catch (e) { return {}; } }
  function writeHandoff(o) { try { localStorage.setItem(HANDOFF_KEY, JSON.stringify(o)); return true; } catch (e) { return false; } }

  // =====================================================================================
  // Navigation and access (only what the signed-in user can use)
  // =====================================================================================
  function P(p) { return function () { return can(p); }; }
  function ANY(ps) { return function () { return canAny(ps); }; }
  var ACCESS = {
    home: function () { return true; }, notifications: function () { return true; },
    queues: P('case.read'), 'case/:id': canOpenCase,
    employees: P('case.read'), 'employee/:id': P('case.read'),
    appointments: ANY(['appointment.manage', 'case.read']),
    referrals: P('partner.refer'),
    absence: ANY(['absence.earlyIntervention', 'advice.report', 'certificate.validate']),
    surveillance: P('surveillance.record'),
    support: P('support.clinical'), 'support/:id': function () { return can('support.clinical') || isOHTeam() || can('support.relief'); },
    'peer-support': function () { return can('peer.volunteer') || hasRole('SAFETY_MANAGER') || hasRole('PEER_SUPPORT_COORDINATOR'); },
    testing: P('testing.select'), 'testing/for-cause': P('testing.forCause'), 'testing/collection': P('testing.collect'),
    'testing/mro': function () { return can('testing.mro') || isMro(); }, 'testing/stats': function () { return can('testing.stats') || isMro(); },
    travel: ANY(['travel.consult', 'advisory.publish', 'advisory.report']),
    communicable: P('cd.manage'), 'communicable/:id': P('cd.manage'),
    campaigns: ANY(['campaign.manage', 'campaign.report', 'screening.record']),
    ergonomics: function () { return can('ergonomics.manage') || can('case.read'); },
    claims: ANY(['claim.open', 'claim.manage']),
    'privacy/audit': P('audit.read'), 'privacy/disclosures': P('disclosure.read'),
    'privacy/break-glass': ANY(['breakglass.review', 'breakglass.request']), 'privacy/consents': P('consent.read')
  };
  function allowed(key) { var f = ACCESS[key]; return !!f && !!f(); }

  var NAV = [
    { group: 'Work', items: [
      { route: 'home', label: 'My work', count: function () { return WZ.tasks().filter(function (t) { return t.link && t.link.app === 'oh' && (t.priority === 'URGENT'); }).length; } },
      { route: 'queues', label: 'Work queues', count: function () { return WZ.list('cases', { open: true }).filter(function (c) { return c.status === 'INTAKE' || c.status === 'TRIAGE'; }).length; } },
      { route: 'appointments', label: 'Clinic diary' },
      { route: 'notifications', label: 'Notifications', count: function () { return WZ.unreadCount(); } }] },
    { group: 'Record', items: [{ route: 'employees', label: 'Employee chart' }, { route: 'referrals', label: 'Partner referrals' }] },
    { group: 'Absence & surveillance', items: [{ route: 'absence', label: 'Absence & advice' }, { route: 'surveillance', label: 'Health surveillance' }] },
    { group: 'Confidential', items: [
      { route: 'support', label: 'Confidential support', count: function () { return WZ.list('supportCases').filter(function (x) { return x.urgentItems.some(function (i) { return i.status === 'OPEN'; }); }).length; } },
      { route: 'peer-support', label: 'Peer support' }] },
    { group: 'Drug & alcohol testing', items: [
      { route: 'testing', label: 'Testing programme' }, { route: 'testing/for-cause', label: 'For-cause request' },
      { route: 'testing/collection', label: 'Collections', count: function () { return WZ.list('tests').filter(function (t) { return ['REQUIRED', 'NOTIFIED', 'DISPATCHED'].indexOf(t.status) >= 0; }).length; } },
      { route: 'testing/mro', label: 'MRO review', count: function () { return WZ.list('tests').filter(function (t) { return t.status === 'MRO_REVIEW'; }).length; } },
      { route: 'testing/stats', label: 'Testing statistics' }] },
    { group: 'Public health', items: [{ route: 'travel', label: 'Travel health' }, { route: 'communicable', label: 'Communicable disease' }] },
    { group: 'Health promotion', items: [{ route: 'campaigns', label: 'Campaigns & screening' }, { route: 'ergonomics', label: 'Ergonomics' }] },
    { group: 'Claims', items: [{ route: 'claims', label: 'Claims' }] },
    { group: 'Privacy', items: [{ route: 'privacy/audit', label: 'Audit log' }, { route: 'privacy/disclosures', label: 'Disclosure log' }, { route: 'privacy/break-glass', label: 'Break-glass' }, { route: 'privacy/consents', label: 'Consents' }] }
  ];
  var ACTIVE_NAV = { 'case/:id': 'queues', 'employee/:id': 'employees', 'support/:id': 'support', 'communicable/:id': 'communicable' };

  function sideNav(active) {
    return h`<nav class="wz-side" aria-label="Workspace">${NAV.map(function (g) {
      var items = g.items.filter(function (it) { return allowed(it.route); });
      if (!items.length) return '';
      return h`<h4>${g.group}</h4>${items.map(function (it) {
        var n = it.count ? it.count() : 0;
        return h`<a href="#/${it.route}" ${raw(it.route === active ? 'aria-current="page"' : '')}>${it.label}${n ? h`<span class="wz-badge danger oh-nav-n">${n}</span>` : ''}</a>`;
      })}`;
    })}</nav>`;
  }
  function firstRoute() { for (var i = 0; i < NAV.length; i++) for (var j = 0; j < NAV[i].items.length; j++) if (NAV[i].items[j].route !== 'home' && allowed(NAV[i].items[j].route)) return NAV[i].items[j]; return null; }

  // =====================================================================================
  // Screens
  // =====================================================================================
  var routes = {};

  // ---------------------------------------------------------------- My work
  routes.home = function () {
    var u = U();
    var tasks = WZ.tasks().filter(function (t) { return t.link && t.link.app === 'oh'; });
    tasks.sort(function (a, b) { var r = { URGENT: 0, HIGH: 1, NORMAL: 2 }; return (r[a.priority] || 3) - (r[b.priority] || 3); });
    var notes = WZ.notifications().slice(0, 5);
    var k = [];
    if (can('case.read')) {
      var open = WZ.list('cases', { open: true });
      k.push(kpi(open.filter(function (c) { return c.owner === u.username; }).length, 'My open cases', 'queues?tab=my'));
      k.push(kpi(open.filter(function (c) { return c.status === 'INTAKE' || c.status === 'TRIAGE'; }).length, 'Awaiting triage', 'queues?tab=intake', true));
      k.push(kpi(open.filter(function (c) { return c.urgency === 'URGENT' || c.urgency === 'EMERGENCY'; }).length, 'Urgent cases', 'queues?tab=urgent', true));
    }
    if (can('support.clinical')) {
      var sup = WZ.list('supportCases');
      k.push(kpi(sup.filter(function (x) { return x.urgentItems.some(function (i) { return i.status === 'OPEN'; }); }).length, 'Urgent call-backs', 'support', true));
      k.push(kpi(sup.filter(function (x) { return x.status !== 'CLOSED'; }).length, 'Open support cases', 'support'));
    }
    if (can('testing.mro')) k.push(kpi(WZ.list('tests').filter(function (t) { return t.status === 'MRO_REVIEW'; }).length, 'Awaiting MRO review', 'testing/mro', true));
    if (can('testing.collect')) k.push(kpi(WZ.list('tests').filter(function (t) { return ['REQUIRED', 'NOTIFIED', 'DISPATCHED'].indexOf(t.status) >= 0; }).length, 'Collections due', 'testing/collection', true));
    if (can('cd.manage')) k.push(kpi(WZ.list('cdCases').filter(function (c) { return c.status !== 'CLOSED'; }).length, 'Open communicable cases', 'communicable'));
    if (canAny(['claim.open', 'claim.manage'])) k.push(kpi(WZ.list('claims').filter(function (c) { return c.status !== 'CLOSED'; }).length, 'Open claims', 'claims'));
    if (can('audit.read')) k.push(kpi(WZ.list('audit').filter(function (a) { return a.outcome === 'DENIED'; }).length, 'Denied access attempts', 'privacy/audit?outcome=DENIED', true));
    if (can('breakglass.review')) k.push(kpi(WZ.list('breakGlass').filter(function (g) { return !g.reviewed; }).length, 'Break-glass to review', 'privacy/break-glass', true));
    k.push(kpi(WZ.unreadCount(), 'Unread notifications', 'notifications'));
    var handoffs = hasRole('AME') ? Object.keys(readHandoff()).map(function (id) { var x = readHandoff()[id]; x.employeeId = id; return x; }) : [];
    var quick = [];
    NAV.forEach(function (g) { g.items.forEach(function (it) { if (it.route !== 'home' && it.route !== 'notifications' && allowed(it.route)) quick.push(it); }); });
    return h`${heading('My work', 'Signed in as ' + u.name + (u.title ? ', ' + u.title : '') + '. Tasks and figures reflect what your role can see.')}
      <div class="oh-kpis">${k}</div>
      ${handoffs.length ? UI.alert('warn', 'Aviation relief decisions requested by the named clinician', h`<ul style="margin:.3rem 0 0">${handoffs.map(function (x) { return h`<li>${empLink(x.employeeId, empName(x.employeeId))} – reference <span class="wz-mono">${x.ref}</span> (${UI.fmtRelative(x.at)}). <a href="#/employee/${x.employeeId}">Open chart</a></li>`; })}</ul>`) : ''}
      <div class="oh-two">
        ${card('Work list', tasks.length ? h`<ul class="wz-list">${tasks.slice(0, 15).map(function (t) {
          return h`<li class="wz-row"><div class="wz-grow"><strong>${t.title}</strong><div class="wz-small wz-muted">${t.detail}</div></div>${priorityBadge(t.priority)}<a class="wz-btn small secondary" href="#/${t.link.route}">Open</a></li>`; })}</ul>` : UI.empty('Nothing waiting for you', 'Your work list is clear.', null, '✓'), tasks.length ? UI.badge(tasks.length + ' items', 'warn') : '')}
        ${card('Latest notifications', notes.length ? h`<ul class="wz-list">${notes.map(noteItem)}</ul>` : UI.empty('No notifications', ''), h`<a href="#/notifications">All</a>`)}
      </div>
      <h2>Your areas</h2>
      <div class="oh-quick">${quick.map(function (it) { return h`<a class="wz-tile" href="#/${it.route}">${it.label}</a>`; })}</div>`;
  };

  // ---------------------------------------------------------------- Work queues
  routes.queues = function () {
    var q = query(); var me = U().username;
    var tab = q.tab || 'my';
    var all = WZ.list('cases', { open: true });
    var defs = [
      ['my', 'My cases', function (c) { return c.owner === me; }],
      ['team', 'Team', function () { return true; }],
      ['unassigned', 'Unassigned', function (c) { return !c.owner; }],
      ['urgent', 'Urgent', function (c) { return c.urgency === 'URGENT' || c.urgency === 'EMERGENCY'; }],
      ['intake', 'Awaiting triage', function (c) { return c.status === 'INTAKE' || c.status === 'TRIAGE'; }]];
    var def = defs.filter(function (d) { return d[0] === tab; })[0] || defs[0];
    var rows = all.filter(def[2]).filter(function (c) {
      if (ui.queueCode && c.queue !== ui.queueCode) return false;
      if (ui.queueQ) { var s = (c.id + ' ' + c.employeeName + ' ' + c.employeeId + ' ' + (c.summary || '')).toLowerCase(); if (s.indexOf(ui.queueQ.toLowerCase()) < 0) return false; }
      return true;
    }).sort(function (a, b) { var r = (URG_RANK[a.urgency] == null ? -1 : URG_RANK[a.urgency]) - (URG_RANK[b.urgency] == null ? -1 : URG_RANK[b.urgency]); return r || a.openedAt.localeCompare(b.openedAt); });
    var queues = Object.keys(QUEUE_LABEL).filter(function (k) { return all.some(function (c) { return c.queue === k; }); });
    return h`${heading('Work queues', 'Open occupational health cases. Untriaged cases first by urgency, then oldest first. Restricted-class cases are not listed here.')}
      <nav class="oh-pills" aria-label="Queues">${defs.map(function (d) { var n = all.filter(d[2]).length; return h`<a href="#/queues?tab=${d[0]}" ${raw(d[0] === def[0] ? 'aria-current="page"' : '')}>${d[1]} <span class="n ${(d[0] === 'urgent' || d[0] === 'intake') && n ? 'hot' : ''}">${n}</span></a>`; })}</nav>
      <form class="wz-card oh-filter" data-form="filter-queue">
        ${UI.field({ type: 'search', name: 'q', label: 'Search', value: ui.queueQ, hint: '' })}
        <div class="wz-field"><label for="f-queue">Queue</label><select id="f-queue" name="queue">${opt('', 'All queues', ui.queueCode)}${queues.map(function (k) { return opt(k, QUEUE_LABEL[k], ui.queueCode); })}</select></div>
        <div class="wz-actions" style="margin:0"><button class="wz-btn" type="submit">Apply</button><button class="wz-btn secondary" type="button" data-act="queue-clear">Clear</button></div>
      </form>
      ${UI.table([
        { label: 'Case', render: function (c) { return h`${caseLink(c.id)}<div class="wz-small wz-muted">${c.typeLabel}</div>`; } },
        { label: 'Employee', render: function (c) { return h`${empLink(c.employeeId, c.employeeName)}<div class="wz-small wz-muted">${c.jobTitle || ''}${safetyRole(c.safetyRole) && safetyRole(c.safetyRole).safetyCritical ? ' · safety-critical' : ''}</div>`; } },
        { label: 'Status', render: function (c) { return UI.status('caseStatus', c.status); } },
        { label: 'Urgency', render: function (c) { return urgencyBadge(c.urgency); } },
        { label: 'Queue', render: function (c) { return QUEUE_LABEL[c.queue] || c.queue; } },
        { label: 'Owner', render: function (c) { return c.owner ? userName(c.owner) : UI.badge('Unassigned', 'warn'); } },
        { label: 'Opened', render: function (c) { return h`<span title="${UI.fmtDateTime(c.openedAt)}">${UI.fmtRelative(c.openedAt)}</span>`; } },
        { label: 'Actions', render: function (c) {
          return h`<div class="wz-actions">${(c.status === 'INTAKE' || c.status === 'TRIAGE') && can('case.triage') ? h`<a class="wz-btn small" href="#/case/${c.id}?tab=triage">Triage</a>` : h`<a class="wz-btn small secondary" href="#/case/${c.id}">Open</a>`}
            ${can('case.assign') && c.owner !== me ? h`<button type="button" class="wz-btn small secondary" data-act="assign-me" data-id="${c.id}">Assign to me</button>` : ''}
            ${can('case.assign') ? h`<button type="button" class="wz-btn small ghost" data-act="assign" data-id="${c.id}">Reassign…</button>` : ''}</div>`; } }
      ], rows, { empty: 'No cases in this queue', caption: def[1] })}
`;
  };

  // ---------------------------------------------------------------- Case detail
  var CASE_TABS = [['overview', 'Overview'], ['triage', 'Triage'], ['notes', 'Notes'], ['fitness', 'Fitness'], ['rtw', 'RTW plan'], ['treatment', 'Treatment'], ['referrals', 'Referrals & claims'], ['appointments', 'Appointments'], ['documents', 'Documents'], ['audit', 'Audit']];
  routes['case/:id'] = function (p) {
    var c = WZ.get('cases', p.id);
    if (!c) {
      return h`<p class="wz-breadcrumb"><a href="#/queues">Work queues</a> › Case</p><h1 tabindex="-1" class="wz-mono">${p.id}</h1>
        ${UI.alert('restricted', 'This case is not available to you', h`<p>It does not exist or it is a restricted-class record (confidential mental-health or substance-testing pathway) that only the named clinician or the MRO can open. Attempts to open restricted records are recorded in the audit log.</p>`)}`;
    }
    var tab = query().tab || 'overview';
    if (!CASE_TABS.some(function (t) { return t[0] === tab; })) tab = 'overview';
    var sr = safetyRole(c.safetyRole);
    var ro = c.accessBasis === 'BREAK_GLASS';
    var body = ({ overview: caseOverview, triage: caseTriage, notes: caseNotes, fitness: caseFitness, rtw: caseRtw, treatment: caseTreatment, referrals: caseReferrals, appointments: caseAppointments, documents: caseDocuments, audit: caseAudit })[tab](c, ro);
    return h`<p class="wz-breadcrumb"><a href="#/queues">Work queues</a> › Case</p>
      <h1 tabindex="-1" class="wz-mono">${c.id}</h1>
      <p class="oh-sub">${empLink(c.employeeId, c.employeeName)} (${c.employeeId}) · ${c.jobTitle || ''} · ${c.typeLabel} · ${WZ.label('source', c.source)}</p>
      ${ro ? UI.alert('restricted', 'Break-glass access – read only', h`<p>You are viewing a restricted-class record under emergency access. The data protection officer has been alerted and reviews every use.</p>`) : ''}
      <div class="wz-card wz-accent" data-test="case-summary">
        <div class="oh-badges">${UI.status('caseStatus', c.status)} ${urgencyBadge(c.urgency)} ${UI.status('fitness', c.fitness.status || 'NOT_ASSESSED')}
          ${sr && sr.safetyCritical ? UI.badge('Safety-critical: ' + sr.name, 'warn') : ''} ${c.classification === 'RESTRICTED_CLINICAL' ? UI.badge('Restricted class', 'restricted') : ''}
          ${c.recordable ? UI.badge('Recordable', 'info') : ''} ${c.linkedIncident ? UI.badge('Incident ' + c.linkedIncident, 'neutral') : ''}</div>
        <div class="oh-meta">
          <div><small>Owner</small>${c.owner ? userName(c.owner) : 'Unassigned'}</div>
          <div><small>Queue</small>${QUEUE_LABEL[c.queue] || c.queue}</div>
          <div><small>Opened</small>${UI.fmtDateTime(c.openedAt)}</div>
          <div><small>Fitness review</small>${c.fitness.reviewDate ? UI.fmtDate(c.fitness.reviewDate) : '—'}</div>
          <div><small>RTW plan</small>${c.rtwPlanId || '—'}</div>
        </div>
      </div>
      <nav class="oh-tabs" aria-label="Case sections">${CASE_TABS.map(function (t) { return h`<a href="#/case/${c.id}?tab=${t[0]}" ${raw(t[0] === tab ? 'aria-current="page"' : '')}>${t[1]}</a>`; })}</nav>
      ${body}`;
  };

  function caseOverview(c, ro) {
    var e = WZ.get('employees', c.employeeId) || {};
    var inc = c.incident;
    var ohUsers = users().filter(function (x) { return isOHTeam(x) && x.roles.indexOf('PSYCH_CLINICIAN') < 0; });
    var tl = (c.timeline || []).slice().reverse();
    return h`<div class="oh-two">
      <div>
        ${card('Case', UI.dl([['Category', c.typeLabel], ['Source', WZ.label('source', c.source)], ['Summary', c.summary], ['Work impact', c.workImpact],
          inc ? ['Incident', [inc.date ? UI.fmtDate(inc.date) : '', inc.location, inc.bodyPart].filter(Boolean).join(' · ')] : null,
          ['Recordable', c.recordable == null ? 'Not yet classified' : c.recordable ? 'Yes' : 'No'], c.closedAt ? ['Closed', UI.fmtDateTime(c.closedAt) + ' – ' + (c.closeReason || '')] : null]))}
        ${card('Work restrictions', (c.restrictions || []).length ? h`<ul class="wz-list">${c.restrictions.map(function (r) { return h`<li class="wz-row"><span>${r.text}</span><span class="wz-small wz-muted">${r.until ? 'until ' + UI.fmtDate(r.until) : 'until further notice'}</span></li>`; })}</ul>` : h`<p class="wz-muted" style="margin:0">No restrictions.</p>`)}
        ${!ro && c.status !== 'CLOSED' && (can('case.assign') || can('case.close')) ? card('Actions', h`
          ${can('case.assign') ? h`<form class="oh-inline-form" data-form="assign" data-id="${c.id}">
            <div class="wz-field"><label for="f-assignee">Case owner</label><select id="f-assignee" name="assignee">${ohUsers.map(function (x) { return opt(x.username, x.name + ' – ' + x.title, c.owner || U().username); })}</select></div>
            <button class="wz-btn secondary" type="submit">Assign</button></form>` : ''}
          ${can('case.close') ? h`<form class="oh-inline-form" data-form="close-case" data-id="${c.id}" style="margin-top:.9rem">
            ${UI.field({ name: 'reason', label: 'Close the case', value: '', hint: 'Reason, shown to the employee' })}
            <button class="wz-btn danger" type="submit">Close case</button></form>
            ${sr(c) ? h`<p class="wz-hint" style="margin:.4rem 0 0">Safety-critical role: a fitness decision is required before the case can be closed.</p>` : ''}` : ''}
          ${errorBox()}`) : ''}
      </div>
      <div>
        ${card('Employee', UI.dl([['Name', empLink(c.employeeId, c.employeeName)], ['Employee ID', c.employeeId], ['Job', e.jobTitle], ['Unit', e.unitName], ['Site', e.site], ['Shift', e.shift], ['Line manager', e.managerName],
          ['Safety role', safetyRole(c.safetyRole) ? safetyRole(c.safetyRole).name : null], ['Current fitness', UI.status('fitness', e.fitnessStatus)], ['Duty status', UI.status('duty', e.dutyStatus)]]))}
        ${card('Timeline', tl.length ? h`<ol class="wz-timeline">${tl.map(function (t) { return h`<li><time>${UI.fmtDateTime(t.at)} · ${t.byName || userName(t.by)}</time>${t.text} ${visBadge(t.vis)}</li>`; })}</ol>` : UI.empty('No entries', ''))}
      </div></div>`;
    function sr(x) { var r = safetyRole(x.safetyRole); return r && r.safetyCritical; }
  }

  function caseTriage(c, ro) {
    var protos = refList('triageProtocols');
    var t = c.triage;
    var proto = t && protos.filter(function (x) { return x.code === t.protocol; })[0];
    var canTriage = !ro && can('case.triage') && ['INTAKE', 'TRIAGE', 'ASSESSMENT'].indexOf(c.status) >= 0;
    return h`<div class="oh-two">
      ${card('Triage result', t ? UI.dl([['Urgency', urgencyBadge(t.urgency)], ['Protocol', proto ? proto.name : (t.protocol || 'None')], ['Queue', QUEUE_LABEL[t.queue] || t.queue], ['Triaged by', userName(t.by)], ['When', UI.fmtDateTime(t.at)],
        t.answers && t.answers.redFlags ? ['Red flags', t.answers.redFlags] : null, ['Recordable', c.recordable == null ? 'Not classified' : c.recordable ? 'Yes' : 'No']]) : UI.empty('Not yet triaged', 'This case is waiting in the intake queue.'))}
      ${canTriage ? h`<form class="wz-card wz-form" data-form="triage" data-id="${c.id}" novalidate>
        <h2>${t ? 'Re-triage' : 'Triage this case'}</h2>
        <div class="wz-field"><label for="f-protocol">Protocol</label><select id="f-protocol" name="protocol">${opt('', 'No protocol', t && t.protocol)}${protos.filter(function (x) { return x.queue !== 'MENTAL_HEALTH'; }).map(function (x) { return opt(x.code, x.name, t && t.protocol); })}</select><span class="wz-hint">Choosing a protocol sets its default urgency and queue.</span></div>
        ${UI.radios({ name: 'urgency', legend: 'Urgency', value: (t && t.urgency) || 'ROUTINE', options: URGENCIES.map(function (x) { return { value: x, label: WZ.label('urgency', x) }; }) })}
        <div class="wz-field"><label for="f-tqueue">Queue</label><select id="f-tqueue" name="queue">${opt('', 'Protocol default (or OH nurse)', '')}${['OH_NURSE', 'PHYSICIAN', 'AEROMEDICAL', 'FOOD_SAFETY', 'CASE_MANAGEMENT'].map(function (k) { return opt(k, QUEUE_LABEL[k], ''); })}</select></div>
        ${UI.checkbox({ name: 'recordable', label: 'Recordable work-related injury or illness (reportable to the safety team)', checked: !!c.recordable })}
        ${UI.field({ name: 'redFlags', label: 'Red flags', optional: true, hint: 'For example "None", "Numbness in both legs"' })}
        ${UI.field({ type: 'textarea', name: 'note', label: 'Triage note (OH only)', optional: true })}
        ${errorBox()}
        <div><button class="wz-btn" type="submit">Save triage</button></div></form>`
        : card(null, h`<p class="wz-muted" style="margin:0">${ro ? 'Read-only access.' : !can('case.triage') ? 'Triage is done by OH nurses and physicians.' : 'This case is past triage.'}</p>`)}
    </div>`;
  }

  function caseNotes(c, ro) {
    var notes = (c.timeline || []).filter(function (t) { return t.type === 'NOTE'; }).reverse();
    return h`<div class="oh-two">
      ${card('Clinical notes', notes.length ? notes.map(function (n) { return h`<div class="oh-note">${n.text}<small>${n.byName || userName(n.by)} · ${UI.fmtDateTime(n.at)} · ${visBadge(n.vis)}</small></div>`; }) : UI.empty('No notes yet', ''))}
      ${!ro && can('case.note') && c.status !== 'CLOSED' ? h`<form class="wz-card wz-form" data-form="note" data-id="${c.id}" novalidate>
        <h2>Add a note</h2>
        ${UI.field({ type: 'textarea', name: 'text', label: 'Note', required: true })}
        ${UI.checkbox({ name: 'share', label: 'Also show this note to the employee (otherwise OH only)' })}
        ${errorBox()}<div><button class="wz-btn" type="submit">Add note</button></div></form>` : ''}
    </div>`;
  }

  function restrictionChecks(selectedCodes) {
    var cat = refList('restrictionCatalogue');
    return h`<fieldset class="wz-fieldset"><legend class="wz-legend">Functional restrictions</legend>
      <span class="wz-hint">What the employee can and cannot do. The line manager sees this wording, never the reason.</span>
      ${checks('restr', cat.map(function (r) { return { value: r.code, label: r.text }; }), selectedCodes)}</fieldset>
      ${UI.field({ name: 'customRestriction', label: 'Other restriction', optional: true, hint: 'Functional wording only, for example "No overhead reaching"' })}`;
  }
  function collectRestrictions(form) {
    var list = checked(form, 'restr');
    var custom = (form.querySelector('[name=customRestriction]') || {}).value;
    if (custom && custom.trim()) list.push({ code: 'CUSTOM', text: custom.trim() });
    return list;
  }

  function caseFitness(c, ro) {
    var f = c.fitness || {};
    var crew = isCrewCode(c.safetyRole);
    var codes = (c.restrictions || []).map(function (r) { return r.code; });
    var form = '';
    if (!ro && c.status !== 'CLOSED') {
      if (can('fitness.decide') && crew && !can('fitness.decide.aviation')) {
        form = UI.alert('warn', 'Aeromedical examiner required', h`<p>${c.employeeName} is ${safetyRole(c.safetyRole).name.toLowerCase()}. Fitness decisions for pilots and cabin crew are recorded by an AME. Add a note for the AME or ask them to review this case.</p>`);
      } else if (can('fitness.decide')) {
        form = h`<form class="wz-card wz-form" data-form="fitness" data-id="${c.id}" novalidate>
          <h2>Record a fitness decision</h2>
          ${crew ? UI.alert('info', null, h`<p>Aeromedical decision (${safetyRole(c.safetyRole).standard}).</p>`) : ''}
          ${UI.radios({ name: 'status', legend: 'Outcome', required: true, options: FITNESS_OUTCOMES.map(function (x) { return { value: x, label: WZ.label('fitness', x) }; }) })}
          ${restrictionChecks(codes)}
          ${UI.field({ type: 'date', name: 'reviewDate', label: 'Review date', value: UI.isoToday(14), hint: 'Restrictions apply until this date unless changed.' })}
          ${UI.field({ type: 'textarea', name: 'note', label: 'Clinical note (OH only)', optional: true })}
          <p class="wz-hint">A fitness certificate (status and restrictions only) is shared with the line manager and the disclosure is logged.${crew ? ' Crew scheduling sees the roster status only.' : ''}</p>
          ${errorBox()}<div><button class="wz-btn" type="submit">Record decision</button></div></form>`;
      } else if (can('restrictions.set')) {
        form = h`<form class="wz-card wz-form" data-form="restrictions" data-id="${c.id}" novalidate>
          <h2>Update work restrictions</h2>
          <p class="wz-hint">Fitness decisions are recorded by an OH physician or AME. You can update functional restrictions.</p>
          ${restrictionChecks(codes)}
          ${UI.field({ type: 'date', name: 'until', label: 'Until', value: f.reviewDate || UI.isoToday(14) })}
          ${errorBox()}<div><button class="wz-btn" type="submit">Save restrictions</button></div></form>`;
      }
    }
    return h`<div class="oh-two">
      <div>${card('Current fitness', UI.dl([['Fitness', UI.status('fitness', f.status || 'NOT_ASSESSED')], ['Decided by', f.decidedBy ? userName(f.decidedBy) : null], ['When', f.decidedAt ? UI.fmtDateTime(f.decidedAt) : null], ['Review date', f.reviewDate ? UI.fmtDate(f.reviewDate) : null], ['Note', f.note]]))}
        ${card('Restrictions', (c.restrictions || []).length ? h`<ul>${c.restrictions.map(function (r) { return h`<li>${r.text}${r.until ? h` <span class="wz-muted">until ${UI.fmtDate(r.until)}</span>` : ''}</li>`; })}</ul>` : h`<p class="wz-muted" style="margin:0">None.</p>`)}</div>
      ${form || card(null, h`<p class="wz-muted" style="margin:0">${ro ? 'Read-only access.' : c.status === 'CLOSED' ? 'The case is closed.' : 'Fitness decisions are recorded by an OH physician or AME.'}</p>`)}
    </div>`;
  }

  function caseRtw(c, ro) {
    var plans = WZ.list('rtwPlans').filter(function (x) { return x.caseId === c.id; });
    var mayCreate = !ro && can('rtw.create') && c.status !== 'CLOSED';
    return h`${plans.length ? plans.map(function (p) {
      return card(h`<span class="wz-mono">${p.id}</span>`, h`
        <p><strong>Goal:</strong> ${p.goal}</p>
        ${UI.dl([['Start', UI.fmtDate(p.startDate)], ['Review', UI.fmtDate(p.reviewDate)], ['Employee acknowledged', p.ack.employee ? UI.fmtDateTime(p.ack.employee) : UI.badge('Waiting', 'warn')], ['Manager acknowledged', p.ack.manager ? UI.fmtDateTime(p.ack.manager) : UI.badge('Waiting', 'warn')]])}
        <h3>Phases</h3>${UI.table([{ label: 'Week', key: 'week' }, { label: 'Hours', key: 'hours' }, { label: 'Duties', key: 'duties' }], p.phases)}
        ${(p.comments || []).length ? h`<h3>Comments</h3><ul>${p.comments.map(function (x) { return h`<li>${userName(x.by)}: ${x.text}</li>`; })}</ul>` : ''}`, UI.status('rtw', p.status));
    }) : UI.empty('No return-to-work plan', 'Create a phased plan below; the employee and line manager both acknowledge it.')}
    ${mayCreate ? h`<form class="wz-card wz-form" data-form="rtw" data-id="${c.id}" novalidate style="margin-top:1rem">
      <h2>New return-to-work plan</h2>
      ${UI.field({ name: 'goal', label: 'Goal', value: 'Return to full duties.' })}
      <div class="oh-three">${UI.field({ type: 'date', name: 'startDate', label: 'Start', value: UI.isoToday(1) })}${UI.field({ type: 'date', name: 'reviewDate', label: 'Review', value: UI.isoToday(21) })}</div>
      <fieldset class="wz-fieldset"><legend class="wz-legend">Phases</legend><span class="wz-hint">Leave duties empty to skip a row. Describe duties and hours – no clinical detail (the manager sees the plan).</span>
        ${[1, 2, 3, 4].map(function (w) { return h`<div class="oh-phase">${UI.field({ type: 'number', name: 'week' + w, label: 'Week', value: w, id: 'f-week' + w })}${UI.field({ name: 'hours' + w, label: 'Hours', value: w === 1 ? '6 hours' : 'Full shift', id: 'f-hours' + w })}${UI.field({ name: 'duties' + w, label: 'Duties', id: 'f-duties' + w })}</div>`; })}</fieldset>
      ${errorBox()}<div><button class="wz-btn" type="submit">Issue plan for acknowledgement</button></div></form>` : ''}`;
  }

  function caseTreatment(c, ro) {
    var plans = WZ.list('treatmentPlans').filter(function (x) { return x.caseId === c.id; });
    return h`<div class="oh-two"><div>${plans.length ? plans.map(function (t) {
        return card(h`<span class="wz-mono">${t.id}</span>`, h`${UI.dl([['Goals', t.goals.join('; ')], ['Interventions', (t.interventions || []).join('; ')], ['Expected recovery', t.expectedRecoveryDays + ' days'], ['Created', UI.fmtDateTime(t.createdAt) + ' by ' + userName(t.createdBy)]])}
          <h3>Follow-ups</h3><ul class="wz-list">${t.followUps.map(function (f) { return h`<li class="wz-row"><span>${UI.fmtDate(f.date)}${f.note ? ' – ' + f.note : ''}</span>${UI.badge(f.status.toLowerCase(), f.status === 'DONE' ? 'success' : 'info')}</li>`; })}</ul>`, UI.badge(t.status.toLowerCase(), t.status === 'ACTIVE' ? 'info' : 'neutral'));
      }) : UI.empty('No treatment plan', '')}</div>
      ${!ro && can('treatment.plan') && c.status !== 'CLOSED' ? h`<form class="wz-card wz-form" data-form="treatment" data-id="${c.id}" novalidate>
        <h2>New treatment plan</h2>
        ${UI.field({ type: 'textarea', name: 'goals', label: 'Goals (one per line)', required: true })}
        ${UI.field({ type: 'textarea', name: 'interventions', label: 'Interventions (one per line)', optional: true })}

        <div class="wz-field"><label for="f-service">Service</label><select id="f-service" name="service">${services.map(function (s) { return opt(s.partnerOrg + '|' + s.code, s.name + ' – ' + partnerName(s.partnerOrg), ''); })}</select></div>

        ${UI.checkbox({ name: 'consent', label: 'The employee has consented to sharing this data set with the partner.' })}

      ${!ro && can('claim.open') && claimable && !claims.some(function (x) { return x.status !== 'CLOSED'; }) ? card('Workers\' compensation', h`<p class="wz-small">Open a claim with the third-party administrator. Only non-clinical documents are shared.</p><a class="wz-btn secondary" href="#/claims?caseId=${c.id}">Open a claim</a>`) : ''}

  function caseAppointments(c, ro) {

      ${!ro && can('appointment.book') && c.status !== 'CLOSED' ? h`<form class="wz-card wz-form" data-form="book-case" data-id="${c.id}" data-emp="${c.employeeId}" novalidate>

  // ---------------------------------------------------------------- Employee chart

    var general = cases.filter(function (c) { return c.classification !== 'RESTRICTED_CLINICAL'; });
    var restrictedCases = cases.filter(function (c) { return c.classification === 'RESTRICTED_CLINICAL'; });
    var support = WZ.list('supportCases', { employeeId: e.id });
    var surv = WZ.list('surveillance', { employeeId: e.id });

    var abs = WZ.list('absences', { employeeId: e.id }).slice(0, 5);
    var docs = WZ.list('documents', { employeeId: e.id });
    var consents = WZ.list('consents', { employeeId: e.id });
    var crew = isCrewCode(e.safetyRole);
    var visibleRestricted = restrictedCases.length + support.length;

    var handoff = readHandoff()[e.id];

    return h`<p class="wz-breadcrumb"><a href="#/employees">Employee chart</a> › ${e.id}</p>
      <h1 tabindex="-1">${e.name} (${e.id})</h1>
      <p class="oh-sub">${e.jobTitle} · ${e.unitName} · ${e.site} · Safety: ${sr ? sr.name : '—'} · Line manager: ${e.managerName || '—'}</p>
      ${hidden ? h`<div class="wz-alert restricted" role="note" data-test="restricted-placeholder"><div class="wz-alert-title">${hidden} restricted case${hidden > 1 ? 's' : ''}</div>

        ${can('breakglass.request') ? h`<button type="button" class="wz-btn danger small" data-act="break-glass" data-id="${e.id}">Emergency access (break-glass)</button>` : ''}</div>` : ''}

      <div class="oh-three">

          <h3>Active restrictions</h3>${e.restrictions.length ? h`<ul style="margin:0;padding-left:1.1rem">${e.restrictions.map(function (r) { return h`<li>${r.text}${r.until ? h` <span class="wz-muted wz-small">until ${UI.fmtDate(r.until)}</span>` : ''}</li>`; })}</ul>` : h`<p class="wz-muted" style="margin:0">None.</p>`}`)}
        ${card('Cases', general.length ? h`<ul class="wz-list">${general.map(function (c) { return h`<li class="wz-row"><div class="wz-grow">${caseLink(c.id)}<div class="wz-small wz-muted">${c.typeLabel} · ${UI.fmtDate(c.openedAt)}</div></div>${UI.status('caseStatus', c.status)}</li>`; })}</ul>` : UI.empty('No cases', ''))}
        ${card('Health surveillance', surv.length ? h`<ul class="wz-list">${surv.map(function (x) { return h`<li class="wz-row"><div class="wz-grow">${x.programmeName}<div class="wz-small wz-muted">Due ${UI.fmtDate(x.dueDate)}${x.lastOutcome ? ' · last ' + x.lastOutcome.toLowerCase() : ''}</div></div>${UI.status('surveillance', x.status)}</li>`; })}</ul>` : h`<p class="wz-muted" style="margin:0">Not enrolled.</p>`)}
      </div>
      ${hasRole('AME') && crew && (nRestricted || handoff) ? h`<form class="wz-card wz-form wz-accent" data-form="ame-relief" data-emp="${e.id}" novalidate>
        <h2>Aviation fitness for a confidential case (AME)</h2>
        <p class="wz-small">Documented exception: the AME decides relief from flying for a restricted case without reading its content. Use the reference the named clinician gave you.</p>
        <div class="oh-three">${UI.field({ name: 'ref', label: 'Confidential case reference', value: handoff ? handoff.ref : '', hint: handoff ? 'Shared by ' + userName(handoff.by) + ' ' + UI.fmtRelative(handoff.at) : 'For example SUP-2026-0031' })}
        <div class="wz-field"><label for="f-afit">Aviation fitness</label><select id="f-afit" name="status">${opt('TEMPORARILY_UNFIT', 'Temporarily unfit – relieve from flying', '')}${opt('FIT_WITH_RESTRICTIONS', 'Fit with restrictions', '')}${opt('FIT', 'Fit – return to flying', '')}</select></div>
        ${UI.field({ type: 'date', name: 'reviewDate', label: 'Review date', value: UI.isoToday(21) })}</div>
        ${errorBox()}<div><button class="wz-btn" type="submit">Record aviation fitness</button></div></form>` : ''}
      ${visibleRestricted ? card('Restricted records' + (grants.length ? ' (break-glass, read only)' : ''), h`<ul class="wz-list">
        ${restrictedCases.map(function (c) { return h`<li class="wz-row"><div class="wz-grow">${caseLink(c.id)} ${UI.badge('Restricted', 'restricted')}<div class="wz-small">${c.summary}</div></div>${UI.status('caseStatus', c.status)}</li>`; })}
        ${support.map(function (x) { return h`<li><div class="wz-row"><div class="wz-grow"><span class="wz-mono">${x.id}</span> ${UI.badge('Confidential support', 'restricted')}<div class="wz-small">${x.concern}</div></div>${UI.status('support', x.status)}</div>

      <div class="oh-two">
        ${card('Upcoming appointments', appts.length ? h`<ul class="wz-list">${appts.map(function (a) { return h`<li class="wz-row"><span>${UI.fmtDateTime(a.start)} · ${a.reason}</span><span class="wz-small wz-muted">${a.clinicianName}</span></li>`; })}</ul>` : h`<p class="wz-muted" style="margin:0">None booked.</p>`, can('appointment.book') ? h`<a href="#/appointments">Clinic diary</a>` : '')}
        ${card('Absence (latest)', abs.length ? h`<ul class="wz-list">${abs.map(function (a) { return h`<li class="wz-row"><span>${UI.fmtDate(a.start)} – ${a.end ? UI.fmtDate(a.end) : 'ongoing'} · ${a.reasonCategory}</span>${a.certificate ? UI.status('absenceCert', a.certificate.status) : ''}</li>`; })}</ul>` : h`<p class="wz-muted" style="margin:0">No absences.</p>`)}
      </div>
      <h2>Documents</h2>${docTable(docs, 'No documents')}
      <h2>Consents</h2>${UI.table([{ label: 'Consent', render: function (x) { return WZ.label('consentType', x.type); } }, { label: 'Scope', key: 'scope' }, { label: 'Status', render: function (x) { return UI.status('consent', x.status); } }, { label: 'Date', render: function (x) { return UI.fmtDate(x.withdrawnAt || x.at); } }], consents, { empty: 'No consents recorded' })}`;

  };
  function adviceCard(a) {

          ${UI.field({ type: 'textarea', name: 'workImpact', id: 'f-wi-' + a.id, label: 'Work impact (no diagnosis)', required: true })}

          <p class="wz-hint">The employee reviews the report before it is released to HR and the line manager.</p>
          ${errorBox()}<div><button class="wz-btn" type="submit">Send to the employee for review</button></div></form></details>` : ''}
      ${a.status === 'AWAITING_EMPLOYEE_REVIEW' && can('advice.report') ? h`<div class="wz-actions"><button type="button" class="wz-btn small secondary" data-act="advice-onbehalf" data-id="${a.id}">Release after review window</button></div>` : ''}

  // ---------------------------------------------------------------- Surveillance

      <div class="oh-kpis">${kpi(n('OVERDUE'), 'Overdue', null, true)}${kpi(n('DUE'), 'Due')}${kpi(n('BOOKED'), 'Booked')}${kpi(n('FOLLOW_UP'), 'Follow-up', null, true)}${kpi(n('NOT_DUE'), 'Up to date')}</div>
      ${ui.lastFollowUp ? UI.alert('warn', 'Follow-up case opened', h`<p>The abnormal result opened case ${caseLink(ui.lastFollowUp)} in the OH nurse queue.</p>`) : ''}
      <div class="oh-pills"><a href="#/surveillance" data-act="surv-filter" data-all="0" ${raw(!ui.survAll ? 'aria-current="page"' : '')}>Due list</a><a href="#/surveillance" data-act="surv-filter" data-all="1" ${raw(ui.survAll ? 'aria-current="page"' : '')}>All enrolments</a></div>
      ${UI.table([

        { label: '', render: function (x) { return h`<div class="wz-actions">${x.status === 'DUE' || x.status === 'OVERDUE' ? h`<button type="button" class="wz-btn small secondary" data-act="surv-invite" data-id="${x.id}">Invite</button>` : ''}
          ${x.status !== 'NOT_DUE' ? h`<button type="button" class="wz-btn small" data-act="surv-result" data-id="${x.id}" data-name="${x.employeeName}" data-prog="${x.programmeName}">Record result</button>` : ''}</div>`; } }
      ], rows, { empty: 'Nothing due' })}`;

  // ---------------------------------------------------------------- Confidential support (named clinician)
  routes.support = function () {
    var list = WZ.list('supportCases').sort(function (a, b) {
      var ua = a.urgentItems.some(function (i) { return i.status === 'OPEN'; }) ? 0 : 1, ub = b.urgentItems.some(function (i) { return i.status === 'OPEN'; }) ? 0 : 1;
      return ua - ub || (a.status === 'CLOSED') - (b.status === 'CLOSED') || b.openedAt.localeCompare(a.openedAt);
    });
    var kernel = WZ.list('cases').filter(function (c) { return c.category === 'PSYCHOLOGICAL'; });
    var urgent = list.filter(function (x) { return x.urgentItems.some(function (i) { return i.status === 'OPEN'; }); });
    return h`${heading('Confidential support', 'Restricted class: visible only to you as the named mental-health clinician. General OH staff see a placeholder count only.')}
      ${urgent.length ? UI.alert('danger', urgent.length + ' urgent call-back' + (urgent.length > 1 ? 's' : '') + ' – target within 1 hour', h`<ul style="margin:.3rem 0 0">${urgent.map(function (x) { return h`<li><a href="#/support/${x.id}">${x.id}</a> – ${x.employeeName} (${x.urgentItems.filter(function (i) { return i.status === 'OPEN'; })[0].reason})</li>`; })}</ul>`) : ''}

      ${UI.table([
        { label: 'Reference', render: function (x) { return h`<a class="wz-mono" href="#/support/${x.id}">${x.id}</a>`; } },
        { label: 'Employee', key: 'employeeName' },
        { label: 'Status', render: function (x) { return h`${UI.status('support', x.status)} ${x.urgentItems.some(function (i) { return i.status === 'OPEN'; }) ? UI.badge('Urgent call-back', 'danger') : ''}`; } },
        { label: 'Risk', render: function (x) { return UI.badge(x.risk.toLowerCase(), x.risk === 'URGENT' || x.risk === 'HIGH' ? 'danger' : x.risk === 'MODERATE' ? 'warn' : 'neutral'); } },

      ], list, { empty: 'No confidential support cases' })}
      ${kernel.length ? h`<h2>Linked restricted kernel cases</h2>${UI.table([{ label: 'Case', render: function (c) { return caseLink(c.id); } }, { label: 'Employee', key: 'employeeName' }, { label: 'Status', render: function (c) { return UI.status('caseStatus', c.status); } }, { label: 'Fitness', render: function (c) { return UI.status('fitness', c.fitness.status); } }], kernel)}` : ''}`;
  };

  routes['support/:id'] = function (p) {

    var e = WZ.get('employees', x.employeeId) || {};

    var handoff = readHandoff()[x.employeeId];
    return h`<p class="wz-breadcrumb"><a href="#/support">Confidential support</a> › ${x.id}</p>

      <div class="wz-card wz-accent"><div class="oh-badges">${UI.status('support', x.status)} ${UI.badge('Risk ' + x.risk.toLowerCase(), x.risk === 'URGENT' || x.risk === 'HIGH' ? 'danger' : 'warn')} ${UI.badge('Restricted class', 'restricted')}</div>
        <div class="oh-meta"><div><small>Opened</small>${UI.fmtDateTime(x.openedAt)}</div><div><small>Source</small>${x.source === 'PROGRAMME_REFERRAL' ? 'Testing programme referral' : 'Self-referral'}</div><div><small>Named clinician</small>${userName(x.namedClinician)}</div><div><small>Kernel case</small>${x.kernelCaseId ? caseLink(x.kernelCaseId) : '—'}</div></div></div>
      ${openItems.map(function (it) { return h`<form class="wz-alert danger wz-form" data-form="callback" data-id="${x.id}" data-item="${it.id}" novalidate>
        <div class="wz-alert-title">Urgent call-back – ${it.target}</div>
        <p style="margin:0">${it.reason} · raised ${UI.fmtDateTime(it.at)}${it.phone ? ' · phone ' + it.phone : ''}${(it.attempts || []).length ? ' · ' + it.attempts.length + ' attempt(s)' : ''}</p>
        ${ro ? '' : h`${UI.radios({ name: 'outcome', legend: 'Outcome of the call', required: true, options: [{ value: 'REACHED_SAFE', label: 'Reached – safe' }, { value: 'NO_ANSWER', label: 'No answer – try again' }, { value: 'EMERGENCY_SERVICES', label: 'Emergency services called' }] })}
        ${UI.field({ name: 'note', id: 'f-cbnote-' + it.id, label: 'Note', optional: true })}${errorBox()}<div><button class="wz-btn danger" type="submit">Record call-back</button></div>`}</form>`; })}
      <div class="oh-two"><div>
        ${card('Concern', h`<p style="margin:0">${x.concern || 'No details given.'}</p>`)}
        ${card('Wellbeing screening', x.screens.length ? UI.table([{ label: 'Date', render: function (s) { return UI.fmtDateTime(s.at); } }, { label: 'Score', className: 'num', key: 'score' }, { label: 'Band', render: function (s) { return s.band.replace(/_/g, ' ').toLowerCase(); } }, { label: 'Item 9', className: 'num', render: function (s) { return s.item9 > 0 ? UI.badge(String(s.item9), 'danger') : '0'; } }], x.screens) : h`<p class="wz-muted" style="margin:0">Not completed.</p>`)}
        ${card('Notes', h`${x.notes.length ? x.notes.slice().reverse().map(function (n) { return h`<div class="oh-note">${n.text}<small>${userName(n.by)} · ${UI.fmtDateTime(n.at)}</small></div>`; }) : h`<p class="wz-muted">No notes yet.</p>`}
          ${!ro && x.status !== 'CLOSED' ? h`<form class="wz-form" data-form="support-note" data-id="${x.id}" novalidate>${UI.field({ type: 'textarea', name: 'text', label: 'Add a note', required: true })}${errorBox()}<div><button class="wz-btn" type="submit">Add note</button></div></form>` : ''}`)}
        ${card('Urgent call-back history', x.urgentItems.filter(function (i) { return i.status !== 'OPEN'; }).length ? h`<ul class="wz-list">${x.urgentItems.filter(function (i) { return i.status !== 'OPEN'; }).map(function (i) { return h`<li class="wz-row"><span>${i.reason}<br><span class="wz-small wz-muted">${UI.fmtDateTime(i.at)} → ${UI.fmtDateTime(i.closedAt)}</span></span>${UI.badge(i.status.replace(/_/g, ' ').toLowerCase(), i.status === 'REACHED_SAFE' ? 'success' : 'danger')}</li>`; })}</ul>` : h`<p class="wz-muted" style="margin:0">None.</p>`)}
      </div><div>

          : !ro && x.status !== 'CLOSED' && can('partner.refer.eap') ? h`<form class="wz-form" data-form="eap" data-id="${x.id}" novalidate><p class="wz-small" style="margin:0">Refer to ${partnerName('EAP_WELLBEING')} for short-term counselling. Only the employee's name and contact preference are shared; the EAP reports attendance and a coded outcome only.</p>
            ${UI.checkbox({ name: 'consent', label: 'The employee has agreed to the EAP referral.' })}${errorBox()}<div><button class="wz-btn" type="submit">Send EAP referral</button></div></form>` : h`<p class="wz-muted" style="margin:0">No EAP referral.</p>`)}
        ${card('Fitness for work', h`${x.fitnessContribution ? UI.dl([['Recorded', UI.status('fitness', x.fitnessContribution.status)], ['By', userName(x.fitnessContribution.by) + ', ' + UI.fmtDateTime(x.fitnessContribution.at)], ['Review', x.fitnessContribution.reviewDate ? UI.fmtDate(x.fitnessContribution.reviewDate) : null]]) : h`<p class="wz-muted">No fitness outcome recorded on this case. Current: ${UI.status('fitness', e.fitnessStatus)} ${UI.status('duty', e.dutyStatus)}</p>`}
          ${!ro && x.status !== 'CLOSED' && can('support.fitness') ? h`<form class="wz-form" data-form="support-fitness" data-id="${x.id}" novalidate style="margin-top:.6rem">

            ${crew ? h`<p class="wz-hint">${e.name} is crew: relief from flying (temporarily unfit) is decided by the AME. You contribute and hand the reference to the AME.</p>` : ''}

        ${card('Sharing with the line manager', h`<p style="margin:0">Employee's choice: <strong>${WZ.label('sharing', x.sharing)}</strong>${x.sharingAt ? ' since ' + UI.fmtDate(x.sharingAt) : ''}.</p>${x.sharedAdjustments ? h`<p class="wz-small">Adjustments shared: ${x.sharedAdjustments}</p>` : ''}<p class="wz-hint" style="margin:.4rem 0 0">Only the employee can change what is shared. Nothing is shared by default.</p>`)}
        ${!ro && x.status !== 'CLOSED' && can('support.clinical') ? h`<form class="wz-card wz-form" data-form="support-close" data-id="${x.id}" novalidate><h2>Close the support case</h2>

          ${errorBox()}<div><button class="wz-btn danger" type="submit">Close support case</button></div></form>` : x.status === 'CLOSED' ? UI.alert('info', 'Closed', h`<p>${x.closeReason || ''}</p>`) : ''}
      </div></div>`;
  };

  routes['testing/mro'] = function () {
    var tests = WZ.list('tests');
    var inLab = tests.filter(function (t) { return t.status === 'IN_LAB' || t.status === 'COLLECTED'; });
    var review = tests.filter(function (t) { return t.status === 'MRO_REVIEW'; });

    var removed = {}; done.forEach(function (t) { if (t.status === 'VERIFIED_POSITIVE' || t.status === 'REFUSAL') removed[t.employeeId] = t; });
    var kernel = WZ.list('cases').filter(function (c) { return c.category === 'SUBSTANCE'; });
    function custody(t) { return (t.custody || []).length ? h`<details class="oh-more"><summary>Chain of custody</summary><ol class="wz-small">${t.custody.map(function (c) { return h`<li>${UI.fmtDateTime(c.at)} – ${c.event.replace(/_/g, ' ').toLowerCase()} (${userName(c.by)})</li>`; })}</ol></details>` : ''; }
    function specimen(t) { var s = t.specimen || {}; return UI.dl([['Employee', t.employeeName], ['Reason', t.reason.replace(/_/g, ' ').toLowerCase()], ['Panel', t.panel], ['Specimen / CCF', (s.id || '—') + ' / ' + (s.ccf || '—')], ['Collected', s.collectedAt ? UI.fmtDateTime(s.collectedAt) + ' by ' + userName(s.collector) : null], s.refusal ? ['Refusal', s.refusal] : null, t.lab ? ['Laboratory', (t.lab.result === 'NON_NEGATIVE' ? 'Non-negative' : 'Negative') + (t.lab.analyte ? ' – ' + t.lab.analyte : '') + ' (' + (t.lab.lab || 'TOXLAB') + ', ' + UI.fmtDateTime(t.lab.at) + ')'] : null]); }
    return h`${heading('MRO review', 'Medical review officer: laboratory results, verdicts and return to duty. HR, managers and crew scheduling only ever receive duty status.')}
      <div class="oh-kpis">${kpi(inLab.length, 'In laboratory')}${kpi(review.length, 'Awaiting verdict', null, true)}${kpi(Object.keys(removed).length, 'Removed / return pending')}${kpi(done.length, 'Verified')}</div>
      ${inLab.length ? h`<h2>In laboratory</h2>${inLab.map(function (t) { return h`<form class="wz-card wz-form" data-form="lab" data-id="${t.id}" novalidate>
        <div class="wz-card-head"><h2 style="margin:0"><span class="wz-mono">${t.id}</span></h2>${UI.status('test', t.status)}</div>${specimen(t)}${custody(t)}
        <div class="wz-alert" style="margin:0"><div class="wz-alert-title">Simulate the TOXLAB result (demo)</div>
        ${UI.radios({ name: 'result', legend: 'Laboratory result', value: 'NEGATIVE', options: [{ value: 'NEGATIVE', label: 'Negative' }, { value: 'NON_NEGATIVE', label: 'Non-negative' }] })}
        <div class="wz-field" style="margin-top:.5rem"><label for="f-an-${t.id}">Analyte (if non-negative)</label><select id="f-an-${t.id}" name="analyte">${ANALYTES.map(function (a) { return opt(a, a, ''); })}</select></div></div>
        ${errorBox()}<div><button class="wz-btn" type="submit">Receive laboratory result</button></div></form>`; })}` : ''}
      <h2>Awaiting MRO verdict</h2>
      ${review.length ? review.map(function (t) { return h`<form class="wz-card wz-form" data-form="verdict" data-id="${t.id}" novalidate>
        <div class="wz-card-head"><h2 style="margin:0"><span class="wz-mono">${t.id}</span></h2>${UI.status('test', t.status)}</div>${specimen(t)}${custody(t)}
        <div class="wz-field"><label for="f-vo-${t.id}">Verdict</label><select id="f-vo-${t.id}" name="outcome">${MRO_OUTCOMES.map(function (o) { return opt(o.value, o.label, t.lab && t.lab.result === 'NEGATIVE' ? 'NEGATIVE' : ''); })}</select></div>
        ${UI.field({ type: 'textarea', name: 'note', id: 'f-vn-' + t.id, label: 'MRO note', optional: true, hint: 'Record the interview with the donor, for example any legitimate medical explanation.' })}
        <p class="wz-hint">A verified positive or refusal removes the employee from safety-sensitive duty, opens a restricted case and a confidential support referral, and sends status-only notices to HR and the line manager.</p>
        ${errorBox()}<div><button class="wz-btn" type="submit">Record verdict</button></div></form>`; }) : UI.empty('Nothing awaiting review', '', null, '✓')}
      ${Object.keys(removed).length ? h`<h2>Return to duty</h2>${UI.table([
        { label: 'Employee', render: function (id) { return removed[id].employeeName; } },
        { label: 'Verdict', render: function (id) { return h`${UI.status('test', removed[id].status)} <span class="wz-small wz-muted">${UI.fmtDate((removed[id].verdict || {}).at)}</span>`; } },
        { label: 'Follow-up tests', render: function (id) { return (removed[id].followUps || []).map(function (f) { return UI.fmtDate(f.due) + ' (' + f.status.toLowerCase() + ')'; }).join(', ') || '—'; } },
        { label: '', render: function (id) { return h`<div class="wz-actions"><button type="button" class="wz-btn small secondary" data-act="rtd" data-id="${id}" data-final="0">Return pending (follow-up testing)</button><button type="button" class="wz-btn small" data-act="rtd" data-id="${id}" data-final="1">Final return to duty</button></div>`; } }
      ], Object.keys(removed))}<p class="wz-hint">Duty status is not part of your view; the engine refuses a return for someone who is not removed from duty.</p>` : ''}
      <h2>Verified results</h2>
      ${UI.table([{ label: 'Test', render: function (t) { return h`<span class="wz-mono">${t.id}</span>`; } }, { label: 'Employee', key: 'employeeName' }, { label: 'Reason', render: function (t) { return t.reason.replace(/_/g, ' ').toLowerCase(); } }, { label: 'Result', render: function (t) { return UI.status('test', t.status); } }, { label: 'Verdict', render: function (t) { return t.verdict ? h`${t.verdict.outcome.replace(/_/g, ' ').toLowerCase()}<div class="wz-small wz-muted">${UI.fmtDateTime(t.verdict.at)}</div>` : '—'; } }], done, { empty: 'None' })}
      ${kernel.length ? h`<h2>Restricted substance cases</h2>${UI.table([{ label: 'Case', render: function (c) { return caseLink(c.id); } }, { label: 'Employee', key: 'employeeName' }, { label: 'Status', render: function (c) { return UI.status('caseStatus', c.status); } }, { label: 'Summary', key: 'summary' }], kernel)}` : ''}`;
  };

  // ---------------------------------------------------------------- Travel health

    var tr = ui.lastTrace && ui.lastTrace.cdCaseId === cd.id ? ui.lastTrace : null;
    return h`<p class="wz-breadcrumb"><a href="#/communicable">Communicable disease</a> › ${cd.id}</p>

  routes['privacy/audit'] = function () {
    var q = query();
    if (q.outcome && !ui.auditOutcome) ui.auditOutcome = q.outcome;
    var all = WZ.list('audit');
    var broken = 0;
    for (var i = 0; i < all.length - 1; i++) if (all[i].prevHash !== all[i + 1].hash) broken++;
    var rows = all.filter(function (a) {
      if (ui.auditOutcome && a.outcome !== ui.auditOutcome) return false;
      if (ui.auditQ) { var s = (a.actor + ' ' + a.actorName + ' ' + a.action + ' ' + a.entityId + ' ' + a.detail).toLowerCase(); if (s.indexOf(ui.auditQ.toLowerCase()) < 0) return false; }
      return true;
    });
    return h`${heading('Audit log', 'Tamper-evident: every entry carries the hash of the previous one. Reads of restricted records, denials and sharing changes are all recorded.')}
      ${broken ? UI.alert('danger', 'Hash chain broken', h`<p>${broken} link(s) do not match.</p>`) : UI.alert('success', 'Hash chain intact', h`<p>${all.length} entries, each linked to the previous one.</p>`)}
