spring:
  flyway:
    locations: classpath:db/migration,classpath:db/demo
  datasource:
    hikari:
      data-source-properties:
        sslmode: disable
wellnessz:
  security:
    issuers: https://idp.test/realms/wellnessz
    rate-limit-per-minute: 0 # integration tests replay many calls per user; the limiter has its own unit test
    integration-rate-limit-per-minute: 0
  analytics:
    min-group-size: 3
  integration:
    outbox:
      poll-interval: PT1H
  notification:
    poll-interval: PT1H
  triage:
    sla:
      poll-interval: PT1H
  device:
    worker:
      poll-interval-ms: 3600000
      initial-delay-ms: 3600000
    housekeeping-interval-ms: 3600000
    alert-interval-ms: 3600000
