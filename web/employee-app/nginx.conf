# WellnessZ employee app – static SPA/PWA server.
# Image: nginxinc/nginx-unprivileged (runs as uid 101, listens on 8080).
# Installed as /etc/nginx/conf.d/default.conf.
#
# Same-origin requirement: the BFF session cookie is SameSite=Strict and the app
# calls relative paths, so the ingress / gateway in front of this container MUST
# route /bff, /oauth2, /login and /logout on the SAME host to wz-bff:8090.
# This container only serves static files.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/wz-security-headers.conf;

    # Liveness/readiness probe
    location = /healthz {
        access_log off;
        include /etc/nginx/wz-security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets – immutable
    location /assets/ {
        include /etc/nginx/wz-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service worker & manifest must be revalidated so updates roll out
    location = /sw.js {
        include /etc/nginx/wz-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/wz-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Runtime config (may be replaced via a ConfigMap mount) – never cached
    location = /config.json {
        include /etc/nginx/wz-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # API/auth paths must never fall through to index.html if the ingress is misrouted
    location ~ ^/(bff|api|oauth2|login|logout)(/|$) {
        include /etc/nginx/wz-security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # index.html – never cached (new deployments take effect immediately)
    location = /index.html {
        include /etc/nginx/wz-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # SPA fallback (hash routing, but keep deep links working)
    location / {
        include /etc/nginx/wz-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
