# OpenTelemetry Collector (contrib) - local development pipeline.
# Receives OTLP traces/metrics/logs from core & bff and prints them.
# NOTE: the former `logging` exporter was removed upstream (v0.111.0); the
# `debug` exporter is its drop-in replacement.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}
  # Defence in depth: strip attributes that could carry PHI/PII even though the
  # apps already mask them at source.
  attributes/scrub:
    actions:
      - key: enduser.id
        action: hash
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: url.query
        action: delete

exporters:
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [debug]
