{{- /*
Flyway migration Job (migrations.mode=job). Runs before install/upgrade as the
schema-owner role using the migrations identity; core never sees that secret.
The SQL scripts are copied from the core image so both always match.
*/ -}}
{{- if and .Values.core.enabled (eq .Values.migrations.mode "job") }}
{{- $root := . -}}
{{- $mig := .Values.migrations -}}
{{- $comp := dict "name" "migrations" "runAsUser" 10001 -}}
{{- $secretsOn := include "wellnessz.secretsEnabled" . -}}
{{- $secretDir := include "wellnessz.secretDir" (dict "root" $root "key" "migrations") -}}
{{- $clientMig := include "wellnessz.clientMigrationsEnabled" . -}}
{{- $cm := .Values.customisation.migrations -}}
{{- $wi := include "wellnessz.wiAnnotations" (dict "root" $root "key" "migrations") | trim }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wellnessz.fullname" . }}-migrations
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "wellnessz.componentLabels" (dict "root" $root "component" "migrations") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with $wi }}
    {{- . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "wellnessz.fullname" . }}-migrations
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "wellnessz.componentLabels" (dict "root" $root "component" "migrations") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
    # Reviewed exceptions (security assessment 2026-10)
    checkov.io/skip1: CKV_K8S_11=Short-lived Job bounded by activeDeadlineSeconds and the namespace ResourceQuota; CPU requests set
    checkov.io/skip2: CKV_K8S_15=Images are pinned by digest in UAT/PROD (migrations.job.image.digest and product digests)
spec:
  backoffLimit: {{ $mig.job.backoffLimit }}
  activeDeadlineSeconds: {{ $mig.job.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ $mig.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "wellnessz.componentLabels" (dict "root" $root "component" "migrations") | nindent 8 }}
        {{- if .Values.workloadIdentity.azure.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "wellnessz.fullname" . }}-migrations
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "wellnessz.podSecurityContext" (dict "root" $root "comp" $comp) | nindent 8 }}
      initContainers:
        # Copy SQL scripts out of the application images so the Job always
        # applies exactly the migrations shipped with this release.
        - name: copy-core-migrations
          image: {{ include "wellnessz.image" (dict "root" $root "comp" .Values.core) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["sh", "-c", "cp -R {{ $mig.job.core.locationInImage }}/. /flyway/core/"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: sql
              mountPath: /flyway/core
              subPath: core
        {{- if .Values.bff.enabled }}
        - name: copy-bff-migrations
          image: {{ include "wellnessz.image" (dict "root" $root "comp" .Values.bff) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["sh", "-c", "cp -R {{ $mig.job.bff.locationInImage }}/. /flyway/bff/"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: sql
              mountPath: /flyway/bff
              subPath: bff
        {{- end }}
        {{- if $clientMig }}
        {{- include "wellnessz.copyClientMigrations" (dict "root" $root "target" "/flyway/client" "volume" "sql" "subPath" "client") | nindent 8 }}
        {{- end }}
        # Core migrations first (init container), then client-specific, then bff (main container)
        - name: flyway-core
          {{- include "wellnessz.flywayContainer" (dict "root" $root "set" "core" "cfg" $mig.job.core "secretsOn" $secretsOn "secretDir" $secretDir) | nindent 10 }}
        {{- if $clientMig }}
        # Client-specific migrations (customisation.migrations): own schema(s) + history table
        - name: flyway-client
          {{- $clientCfg := dict "schemas" (include "wellnessz.clientMigrationSchemas" $root) "table" $cm.table "appRole" $mig.job.core.appRole }}
          {{- include "wellnessz.flywayContainer" (dict "root" $root "set" "client" "cfg" $clientCfg "secretsOn" $secretsOn "secretDir" $secretDir) | nindent 10 }}
        {{- end }}
      containers:
        {{- if .Values.bff.enabled }}
        - name: flyway-bff
          {{- include "wellnessz.flywayContainer" (dict "root" $root "set" "bff" "cfg" $mig.job.bff "secretsOn" $secretsOn "secretDir" $secretDir) | nindent 10 }}
        {{- else }}
        - name: done
          image: {{ include "wellnessz.image" (dict "root" $root "comp" .Values.core) | quote }}
          command: ["true"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
        {{- end }}
      volumes:
        - name: sql
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        {{- if and $clientMig $cm.configMap }}
        - name: client-configmap
          configMap:
            name: {{ $cm.configMap }}
        {{- end }}
        {{- if $secretsOn }}
        {{- include "wellnessz.secretVolume" (dict "root" $root "key" "migrations") | nindent 8 }}
        {{- end }}
{{- end }}
