{{- /*
Core API and BFF Deployments (Spring Boot, Java 21).
*/ -}}
{{- $root := . -}}
{{- $secretsOn := include "wellnessz.secretsEnabled" . -}}
{{- $mig := .Values.migrations -}}
{{- if not (has $mig.mode (list "app" "job")) }}
{{- fail "migrations.mode must be 'app' or 'job'" }}
{{- end }}
{{- range $key := list "core" "bff" }}
{{- $comp := index $root.Values $key }}
{{- if $comp.enabled }}
{{- $ctx := dict "root" $root "comp" $comp }}
{{- $name := include "wellnessz.componentName" $ctx }}
{{- $secretDir := include "wellnessz.secretDir" (dict "root" $root "key" $key) }}
{{- /* client-specific Flyway migrations run by core itself (migrations.mode=app) */}}
{{- $clientMig := and (eq $key "core") (eq $mig.mode "app") (include "wellnessz.clientMigrationsEnabled" $root) }}
{{- $cm := $root.Values.customisation.migrations }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "wellnessz.componentLabels" (dict "root" $root "component" $comp.name) | nindent 4 }}
  annotations:
    # Reviewed exceptions (security assessment 2026-10) – see docs/security/Security-Enhancement-Guideline.md
    checkov.io/skip1: CKV_K8S_11=No CPU limit by design (avoids CFS throttling of the JVM); CPU requests, HPA and namespace ResourceQuota bound usage
    checkov.io/skip2: CKV_K8S_43=Default values use tags for local use; UAT/PROD set global.requireImageDigests and the pipeline pins every image by digest
    checkov.io/skip3: CKV_K8S_15=Images are pinned by digest in UAT/PROD, so IfNotPresent cannot run a different image
    {{- with $root.Values.global.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not $comp.autoscaling.enabled }}
  replicas: {{ $comp.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "wellnessz.componentSelectorLabels" (dict "root" $root "component" $comp.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wellnessz.componentLabels" (dict "root" $root "component" $comp.name) | nindent 8 }}
        {{- if $root.Values.workloadIdentity.azure.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with $comp.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- if eq $key "core" }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $comp.ports.management | quote }}
        prometheus.io/path: /actuator/prometheus
        {{- end }}
        {{- with $comp.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "wellnessz.serviceAccountName" $ctx }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "wellnessz.podSecurityContext" $ctx | nindent 8 }}
      terminationGracePeriodSeconds: 45
      {{- include "wellnessz.topologySpread" $ctx | nindent 6 }}
      {{- if $clientMig }}
      initContainers:
        {{- include "wellnessz.copyClientMigrations" (dict "root" $root "target" $cm.mountPath "volume" "client-migrations") | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $comp.name }}
          image: {{ include "wellnessz.image" $ctx | quote }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $comp.ports.http }}
              protocol: TCP
            - name: management
              containerPort: {{ $comp.ports.management }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $name }}-env
            {{- if not $secretsOn }}
            {{- with (index $root.Values.secrets.existingSecret $key) }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- if and (eq $mig.mode "app") $root.Values.secrets.existingSecret.migrations }}
            - secretRef:
                name: {{ $root.Values.secrets.existingSecret.migrations }}
            {{- end }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment={{ $root.Values.global.environment }},k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME)"
            # WZ_FLYWAY_ENABLED (app contract) + SPRING_FLYWAY_ENABLED (standard
            # Spring property; honoured even where the app does not bind the former)
            - name: WZ_FLYWAY_ENABLED
              value: {{ eq $mig.mode "app" | quote }}
            - name: SPRING_FLYWAY_ENABLED
              value: {{ eq $mig.mode "app" | quote }}
            {{- if eq $mig.mode "app" }}
            - name: WZ_DB_MIGRATOR_USERNAME
              value: {{ $mig.migratorUsername | quote }}
            {{- end }}
            {{- if $secretsOn }}
            {{- $files := index $root.Values.secrets $key "files" }}
            {{- if eq $mig.mode "app" }}
            {{- $files = concat $files $root.Values.secrets.migrations.files }}
            {{- end }}
            {{- range $files }}
            {{- if .env }}
            - name: {{ .env }}
              value: {{ ternary (printf "file:%s/%s" $secretDir .fileName) (printf "%s/%s" $secretDir .fileName) (eq (default "fileRef" .format) "fileRef") | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with $comp.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ $comp.probes.livenessPath }}
              port: management
            periodSeconds: 5
            failureThreshold: {{ $comp.probes.startupFailureThreshold }}
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: {{ $comp.probes.livenessPath }}
              port: management
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: {{ $comp.probes.readinessPath }}
              port: management
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            {{- toYaml $comp.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $clientMig }}
            - name: client-migrations
              mountPath: {{ $cm.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $secretsOn }}
            - name: secrets-{{ $key }}
              mountPath: {{ $secretDir }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ $comp.tmpSizeLimit }}
        {{- if $clientMig }}
        - name: client-migrations
          emptyDir:
            sizeLimit: 64Mi
        {{- if $cm.configMap }}
        - name: client-configmap
          configMap:
            name: {{ $cm.configMap }}
        {{- end }}
        {{- end }}
        {{- if $secretsOn }}
        {{- include "wellnessz.secretVolume" (dict "root" $root "key" $key) | nindent 8 }}
        {{- end }}
      {{- with $comp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $comp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $comp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
