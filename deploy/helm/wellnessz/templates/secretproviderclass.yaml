{{- /*
SecretProviderClass per identity (least privilege: bff cannot read core keys).
  core        : core files (+ migrator file when migrations.mode=app)
  bff         : bff files  (+ migrator file when migrations.mode=app)
  migrations  : migrator file (Helm hook, only when migrations.mode=job)
*/ -}}
{{- $root := . -}}
{{- $p := .Values.secrets.provider -}}
{{- if ne $p "none" }}
{{- if not (has $p (list "azure" "gcp" "vault")) }}
{{- fail "secrets.provider must be one of none|azure|gcp|vault" }}
{{- end }}
{{- $sets := list }}
{{- if .Values.core.enabled }}
{{- $coreFiles := .Values.secrets.core.files }}
{{- if eq .Values.migrations.mode "app" }}
{{- $coreFiles = concat $coreFiles .Values.secrets.migrations.files }}
{{- end }}
{{- $sets = append $sets (dict "key" "core" "files" $coreFiles "hook" false) }}
{{- end }}
{{- if .Values.bff.enabled }}
{{- $bffFiles := .Values.secrets.bff.files }}
{{- if eq .Values.migrations.mode "app" }}
{{- $bffFiles = concat $bffFiles .Values.secrets.migrations.files }}
{{- end }}
{{- $sets = append $sets (dict "key" "bff" "files" $bffFiles "hook" false) }}
{{- end }}
{{- if and .Values.core.enabled (eq .Values.migrations.mode "job") }}
{{- $sets = append $sets (dict "key" "migrations" "files" .Values.secrets.migrations.files "hook" true) }}
{{- end }}
{{- range $s := $sets }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ printf "%s-%s" (include "wellnessz.fullname" $root) $s.key }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "wellnessz.componentLabels" (dict "root" $root "component" $s.key) | nindent 4 }}
  {{- if $s.hook }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  provider: {{ ternary $root.Values.secrets.gcp.providerName $p (eq $p "gcp") }}
  {{- if $root.Values.secrets.syncToKubernetesSecret }}
  secretObjects:
    - secretName: {{ printf "%s-%s-synced" (include "wellnessz.fullname" $root) $s.key }}
      type: Opaque
      data:
        {{- range $s.files }}
        - objectName: {{ .fileName | quote }}
          key: {{ .fileName | quote }}
        {{- end }}
  {{- end }}
  parameters:
    {{- if eq $p "azure" }}
    {{- $az := $root.Values.secrets.azure }}
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required (printf "workloadIdentity.azure.clientIds.%s is required for secrets.provider=azure" $s.key) (index $root.Values.workloadIdentity.azure.clientIds $s.key) | quote }}
    keyvaultName: {{ required "secrets.azure.keyVaultName is required" $az.keyVaultName | quote }}
    tenantId: {{ required "secrets.azure.tenantId is required" $az.tenantId | quote }}
    cloudName: {{ $az.cloudName | quote }}
    objects: |
      array:
      {{- range $s.files }}
        - |
          objectName: {{ .remoteName }}
          objectType: secret
          objectAlias: {{ .fileName }}
      {{- end }}
    {{- else if eq $p "gcp" }}
    {{- $projectId := required "secrets.gcp.projectId is required" $root.Values.secrets.gcp.projectId }}
    {{- if eq $root.Values.secrets.gcp.providerName "gcp" }}
    auth: pod-adc
    {{- end }}
    secrets: |
      {{- range $s.files }}
      - resourceName: "projects/{{ $projectId }}/secrets/{{ .remoteName }}/versions/latest"
        path: {{ .fileName | quote }}
      {{- end }}
    {{- else if eq $p "vault" }}
    {{- $v := $root.Values.secrets.vault }}
    vaultAddress: {{ required "secrets.vault.address is required" $v.address | quote }}
    vaultKubernetesMountPath: {{ $v.kubernetesMountPath | quote }}
    roleName: {{ index $v.roles $s.key | quote }}
    objects: |
      {{- range $s.files }}
      {{- $parts := splitList "#" .remoteName }}
      - objectName: {{ .fileName | quote }}
        secretPath: {{ first $parts | quote }}
        secretKey: {{ last $parts | quote }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
