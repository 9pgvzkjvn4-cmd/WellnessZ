{{- /*
Static web apps (employee portal, manager workspace, OH workspace) served by nginx-unprivileged.
*/ -}}
{{- $root := . -}}
{{- range $key := list "employeePortal" "managerWorkspace" "ohWorkspace" "partnerPortal" }}
{{- $comp := index $root.Values $key }}
{{- if $comp.enabled }}
{{- $ctx := dict "root" $root "comp" $comp }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wellnessz.componentName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "wellnessz.componentLabels" (dict "root" $root "component" $comp.name) | nindent 4 }}
  annotations:
    # Reviewed exceptions (security assessment 2026-10) – see docs/security/Security-Enhancement-Guideline.md
    checkov.io/skip1: CKV_K8S_11=No CPU limit by design (avoids CFS throttling); CPU requests, HPA and namespace ResourceQuota bound usage
    checkov.io/skip2: CKV_K8S_43=Default values use tags for local use; UAT/PROD set global.requireImageDigests and the pipeline pins every image by digest
    checkov.io/skip3: CKV_K8S_15=Images are pinned by digest in UAT/PROD, so IfNotPresent cannot run a different image
    checkov.io/skip4: CKV_K8S_40=nginx-unprivileged UID 101, runAsNonRoot, read-only root filesystem, all capabilities dropped, no host mounts
    {{- with $root.Values.global.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not $comp.autoscaling.enabled }}
  replicas: {{ $comp.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "wellnessz.componentSelectorLabels" (dict "root" $root "component" $comp.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wellnessz.componentLabels" (dict "root" $root "component" $comp.name) | nindent 8 }}
        {{- with $comp.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $comp.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "wellnessz.serviceAccountName" $ctx }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "wellnessz.podSecurityContext" $ctx | nindent 8 }}
      terminationGracePeriodSeconds: 20
      {{- include "wellnessz.topologySpread" $ctx | nindent 6 }}
      containers:
        - name: {{ $comp.name }}
          image: {{ include "wellnessz.image" $ctx | quote }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $comp.ports.http }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ $comp.probes.path }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: {{ $comp.probes.path }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml $comp.resources | nindent 12 }}
          volumeMounts:
            # nginx-unprivileged writes pid + temp files under /tmp
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ $comp.tmpSizeLimit }}
      {{- with $comp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $comp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $comp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
