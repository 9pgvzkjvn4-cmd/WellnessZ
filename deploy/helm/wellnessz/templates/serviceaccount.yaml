{{- $root := . -}}
{{- range $key := list "core" "bff" "employeePortal" "managerWorkspace" }}
{{- $comp := index $root.Values $key }}
{{- if and $comp.enabled $comp.serviceAccount.create }}
{{- $ctx := dict "root" $root "comp" $comp }}
{{- $wi := include "wellnessz.wiAnnotations" (dict "root" $root "key" $key) | trim }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wellnessz.serviceAccountName" $ctx }}
  labels:
    {{- include "wellnessz.componentLabels" (dict "root" $root "component" $comp.name) | nindent 4 }}
  {{- if or $wi $comp.serviceAccount.annotations }}
  annotations:
    {{- with $wi }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with $comp.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
