# =============================================================================
# HYBRID on-prem core - PROD - zone-redundant, HA, least privilege
# On-prem cluster (RKE2 / OpenShift) running wz-core-app next to CloudNativePG:
#   -f values.yaml -f values-hybrid.yaml -f environments/hybrid/prod.yaml
# The cloud edge (BFF + web apps) uses the cloud overlay of the same environment:
#   -f values.yaml -f values-azure.yaml -f environments/azure/prod.yaml \
#   -f ../../hybrid/values-hybrid-cloud-edge.yaml --set-string bff.env.WZ_CORE_API_URL=https://api.wellnessz.onprem.example.internal
# Image policy: signed release digests only (vX.Y.Z promoted unchanged from
# UAT); rendering fails unless every component has image.digest.
# Vault: one KV path prefix per environment (kv/data/wellnessz/prod/...), one
# Kubernetes auth mount per cluster; see deploy/hybrid/external-secrets.
# =============================================================================
global:
  environment: prod
  imageRegistry: registry.onprem.example.internal/wellnessz   # mirror; digests are preserved by the mirror copy
  requireImageDigests: true

secrets:
  vault:
    kubernetesMountPath: kubernetes-wellnessz-prod
    roles:
      core: wellnessz-core-prod
      bff: wellnessz-bff-prod
      migrations: wellnessz-migrations-prod
  core:
    files:
      - fileName: wz-db-password
        remoteName: kv/data/wellnessz/prod/core#wz-db-password
        env: WZ_DB_PASSWORD
        format: fileRef
      - fileName: wz-master-key
        remoteName: kv/data/wellnessz/prod/core#wz-master-key
        env: WZ_MASTER_KEY_FILE
        format: path
      - fileName: wz-pseudonym-key
        remoteName: kv/data/wellnessz/prod/core#wz-pseudonym-key
        env: WZ_PSEUDONYM_KEY
        format: fileRef
      - fileName: wellnessz-db-ca.crt
        remoteName: kv/data/wellnessz/prod/core#db-ca-crt
  migrations:
    files:
      - fileName: wz-migrator-db-password
        remoteName: kv/data/wellnessz/prod/migrations#password
        env: WZ_DB_MIGRATOR_PASSWORD
        format: fileRef
      - fileName: wellnessz-db-ca.crt
        remoteName: kv/data/wellnessz/prod/core#db-ca-crt

migrations:
  mode: job   # hybrid always uses the pre-upgrade Job (core never holds the owner credential)

topologySpread:
  whenUnsatisfiable: DoNotSchedule

core:
  replicaCount: 3
  resources:
    requests: { cpu: "1", memory: 1536Mi }
    limits: { memory: 2Gi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
  pdb:
    enabled: true
    minAvailable: 2
  env:
    WZ_OIDC_ISSUERS: "https://login.microsoftonline.com/<prod-tenant-id>/v2.0"
    WZ_OIDC_AUDIENCE: "<prod-wellnessz-api-client-id>"
    WZ_CORS_ORIGINS: "https://employee.wellnessz.example.com,https://manager.wellnessz.example.com,https://oh.wellnessz.example.com,https://partners.wellnessz.example.com"
    # external partner / TPA roles only with MFA proof (amr/acr) in the token
    WZ_MFA_REQUIRED_ROLES: "PARTNER_PROVIDER,TPA_ADJUSTER"
    # links in content-free notifications (must match ingress.hosts)
    WZ_EMPLOYEE_PORTAL_URL: "https://employee.wellnessz.example.com"
    WZ_MANAGER_WORKSPACE_URL: "https://manager.wellnessz.example.com"
    WZ_OH_WORKSPACE_URL: "https://oh.wellnessz.example.com"
    WZ_PARTNER_PORTAL_URL: "https://partners.wellnessz.example.com"

ingress:
  api:
    enabled: true
    host: api.wellnessz.onprem.example.internal

networkPolicy:
  defaultDenyNamespace: true
  # The cloud edge BFF of the same environment reaches core:8080 over the private link
  # (AKS node subnet of the prod VNet - terraform subnet_cidrs.aks; GKE: subnet_cidr)
  coreExtraIngressPeers:
    - ipBlock:
        cidr: 10.40.0.0/23

observability:
  logLevel: INFO
  rootLogLevel: WARN
  traceSampling: "0.05"

# Client customisation hooks (see deploy/environments/README.md)
customisation:
  client: ""
  featureFlags: {}
  # featureFlags:
  #   travel-health-v2: true    # -> WZ_FEATURE_TRAVEL_HEALTH_V2="true" on core and bff
