 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      env: WZ_DEVICE_TOKEN_PEPPER
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      format: fileRef
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    - fileName: wz-device-trust-anchors.pem
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      remoteName: wz-device-trust-anchors
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      env: WZ_DEVICE_TRUST_ANCHORS
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      format: path
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# provider=none only: names of pre-created Secrets injected with envFrom.
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysexistingSecret:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  core: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  bff: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  migrations: ""

# -----------------------------------------------------------------------------
# Database migrations (Flyway) - core (schemas platform..analytics) and bff
# (schema bff, Spring Session tables). Table-level grants come from the
# migrations via the ${app_role} placeholder.
# /etc/wellnessz/gateway/secrets (mode 0400). Expected keys app: core and bff run Flyway on start-up as the schema-owner role
# /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      (WZ_DB_MIGRATOR_USERNAME / WZ_DB_MIGRATOR_PASSWORD)
# /etc/wellnessz/gateway/secrets (mode 0400). Expected keys job: a pre-install/pre-upgrade Job runs Flyway CLI; core then runs with
# /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      Flyway disabled and never holds the migrator credential (preferred
# /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      for prod - least privilege).
# -----------------------------------------------------------------------------
migrations:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysmode: app
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysmigratorUsername: wz_migrator
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysjob:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  image:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    repository: flyway/flyway
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    tag: 11.20.3-alpine
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    # sha256 digest of the (mirrored) Flyway image; set it in UAT/PROD so the migration Job is pinned like the
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    # product images (go-live item, security assessment 2026-10). Takes precedence over tag.
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    digest: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    fullName: ""   # overrides repository:tag / @digest when set (e.g. mirrored image)
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  # Location of SQL migrations inside the images (Spring Boot layered extraction)
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  core:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    locationInImage: /app/BOOT-INF/classes/db/migration
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    schemas: platform,masterdata,intake,casemgmt,triage,docs,ohrecord,fitness,absence,surveillance,scheduling,treatment,claims,mentalhealth,substance,travelhealth,promotion,deviceint,devicecat,devicecap,devicesec,analytics
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    table: flyway_schema_history
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    appRole: wz_app
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  bff:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    locationInImage: /app/BOOT-INF/classes/db/bff
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    schemas: bff
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    table: flyway_schema_history_bff
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    appRole: wz_bff
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  # JDBC URL for Flyway; defaults to core.env.WZ_DB_URL
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  dbUrl: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  extraArgs: []
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  backoffLimit: 1
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  activeDeadlineSeconds: 900
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  ttlSecondsAfterFinished: 86400
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  resources:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    requests: { cpu: 100m, memory: 256Mi }
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    limits: { memory: 512Mi }

# -----------------------------------------------------------------------------
# Shared pod hardening (applied to every workload)
# -----------------------------------------------------------------------------
podSecurityContext:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysrunAsNonRoot: true
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysseccompProfile:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  type: RuntimeDefault
containerSecurityContext:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysallowPrivilegeEscalation: false
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysreadOnlyRootFilesystem: true
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysprivileged: false
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keyscapabilities:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  drop: ["ALL"]

# -----------------------------------------------------------------------------
# Observability knobs per environment (rendered into the core/bff ConfigMaps;
# empty = application default)
# /etc/wellnessz/gateway/secrets (mode 0400). Expected keys logLevel       -> LOGGING_LEVEL_COM_WELLNESSZ
# /etc/wellnessz/gateway/secrets (mode 0400). Expected keys rootLogLevel   -> LOGGING_LEVEL_ROOT
# /etc/wellnessz/gateway/secrets (mode 0400). Expected keys traceSampling  -> MANAGEMENT_TRACING_SAMPLING_PROBABILITY (+ WZ_TRACE_SAMPLING), 0.0-1.0
# -----------------------------------------------------------------------------
observability:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keyslogLevel: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysrootLogLevel: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keystraceSampling: ""

topologySpread:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysenabled: true
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# ScheduleAnyway keeps single-zone clusters schedulable; use DoNotSchedule in prod.
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keyswhenUnsatisfiable: ScheduleAnyway

