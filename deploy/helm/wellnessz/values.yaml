 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys#                              Public material, but kept in the vault so it is change-controlled with the CA.
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# Rotating the pepper invalidates every endpoint token (re-enrolment / ROTATE_TOKEN) - see
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# docs/increment-06/04-Device-Administrator-Guide.md.
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysdevice:
