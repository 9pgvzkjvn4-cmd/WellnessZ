# =============================================================================
# WellnessZ Helm chart - default values (secure, cloud-neutral).
# Layer a platform file on top:
# /etc/wellnessz/gateway/secrets (mode 0400). Expected keys -f values.yaml -f values-azure.yaml | values-gcp.yaml | values-hybrid.yaml | values-local.yaml
# Secrets are NEVER set in values files: they are mounted from Azure Key Vault,
# GCP Secret Manager or HashiCorp Vault through the Secrets Store CSI driver
# (secrets.provider) or, for local clusters only, from a pre-created Secret.
# =============================================================================

global:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# Registry + repository prefix, e.g. ghcr.io/acme/wellnessz, myacr.azurecr.io/wellnessz,
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# europe-west4-docker.pkg.dev/my-project/wellnessz
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysimageRegistry: ghcr.io/OWNER/wellnessz
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# Defaults to .Chart.AppVersion when empty. CD sets this to the release tag.
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysimageTag: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysimagePullPolicy: IfNotPresent
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysimagePullSecrets: []
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# Environment name (local|dev|uat|prod) - label, OTel deployment.environment.
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysenvironment: dev
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# Refuse to render unless every enabled component is pinned by digest
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# (component.image.digest). On in prod: only the signed release digests that
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# passed dev and uat can be deployed (set by .github/workflows/deploy-env.yml).
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysrequireImageDigests: false
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# Spring profile(s) for core and bff (local|azure|gcp|hybrid|prod)
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysspringProfiles: prod
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# OpenShift: let the restricted-v2 SCC assign UIDs (omits runAsUser/runAsGroup/fsGroup)
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysopenshift: false
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keyscommonLabels: {}
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keyscommonAnnotations: {}

# -----------------------------------------------------------------------------
# Workload identity - no static cloud credentials in the cluster.
# -----------------------------------------------------------------------------
workloadIdentity:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysazure:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  enabled: false
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  tenantId: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  # Client IDs of the user-assigned managed identities (Terraform outputs)
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  clientIds:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    core: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    bff: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    migrations: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysgcp:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  enabled: false
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  # Google service account emails (Terraform outputs)
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  serviceAccounts:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    core: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    bff: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    migrations: ""

# -----------------------------------------------------------------------------
# Secrets - Secrets Store CSI driver (secrets-store.csi.x-k8s.io/v1)
# /etc/wellnessz/gateway/secrets (mode 0400). Expected keys provider: none  -> use secrets.existingSecret.* (envFrom), local clusters only
# /etc/wellnessz/gateway/secrets (mode 0400). Expected keys provider: azure -> Azure Key Vault provider (workload identity)
# /etc/wellnessz/gateway/secrets (mode 0400). Expected keys provider: gcp   -> GCP Secret Manager provider (workload identity)
# /etc/wellnessz/gateway/secrets (mode 0400). Expected keys provider: vault -> HashiCorp Vault provider (Kubernetes auth)
# Files land in <mountPath>/<component>/<fileName>; the apps read them through
# `file:` references (wz-secrets SecretResolver) or WZ_MASTER_KEY_FILE.
# -----------------------------------------------------------------------------
secrets:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysprovider: none
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysmountPath: /mnt/secrets
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# Also mirror into a Kubernetes Secret (secretObjects). Keep false so
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# secret material is not persisted in etcd.
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keyssyncToKubernetesSecret: false
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysazure:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  keyVaultName: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  tenantId: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  cloudName: AzurePublicCloud
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysgcp:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  projectId: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  # "gke" = GKE-managed Secret Manager add-on (driver secrets-store-gke.csi.k8s.io)
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  # "gcp" = open-source secrets-store-csi-driver-provider-gcp
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  providerName: gke
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# CSI driver name; GKE add-on uses secrets-store-gke.csi.k8s.io
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keyscsiDriver: secrets-store.csi.k8s.io
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysvault:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  address: ""
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  kubernetesMountPath: kubernetes
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  roles:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    core: wellnessz-core
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    bff: wellnessz-bff
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    migrations: wellnessz-migrations
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# remoteName = Key Vault secret name / Secret Manager secret id / Vault "path#key"
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# env/format: export an env var pointing at the mounted file
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys#   format: fileRef -> ENV=file:<path>   (wz-secrets SecretResolver, sensitive props)
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys#   format: path    -> ENV=<path>        (e.g. WZ_MASTER_KEY_FILE)
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keyscore:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  files:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    - fileName: wz-db-password
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      remoteName: wz-db-password
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      env: WZ_DB_PASSWORD
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      format: fileRef
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    - fileName: wz-master-key
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      remoteName: wz-master-key
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      env: WZ_MASTER_KEY_FILE
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      format: path
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    - fileName: wz-pseudonym-key
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      remoteName: wz-pseudonym-key
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      env: WZ_PSEUDONYM_KEY
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      format: fileRef
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysbff:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  files:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    - fileName: wz-bff-client-secret
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      remoteName: wz-bff-client-secret
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      env: WZ_BFF_CLIENT_SECRET
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      format: fileRef
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    - fileName: wz-bff-db-password
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      remoteName: wz-bff-db-password
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      env: WZ_BFF_DB_PASSWORD
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      format: fileRef
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    # Session-encryption key - deliberately NOT the core master key
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    - fileName: wz-bff-session-key
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      remoteName: wz-bff-session-key
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      env: WZ_MASTER_KEY_FILE
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      format: path
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keysmigrations:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys  files:
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    # migrations.mode=app: merged into the core and bff volumes;
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    # mode=job: mounted only into the Flyway Job.
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys    - fileName: wz-migrator-db-password
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      remoteName: wz-migrator-db-password
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      env: WZ_DB_MIGRATOR_PASSWORD
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys      format: fileRef
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# Increment 6 (E34) device-security secrets, mounted into core ONLY when
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# deviceIngest.enabled (kept separate from core.files so platform overlays that
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys# replace core.files do not drop them). Same identity / SecretProviderClass as core.
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys#   WZ_DEVICE_TOKEN_PEPPER  -> wellnessz.device.security.token-pepper (TokenHasher): HMAC pepper for
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys#                              endpoint-token hashes, >= 16 bytes (32 random bytes recommended), never in the DB.
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys#                              `file:` reference resolved by wz-secrets (property name contains "token").
 /etc/wellnessz/gateway/secrets (mode 0400). Expected keys#   WZ_DEVICE_TRUST_ANCHORS -> wellnessz.device.pki.trust-anchors (CertificateVerifier): path to a PEM
