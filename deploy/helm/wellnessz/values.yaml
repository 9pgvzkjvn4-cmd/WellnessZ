# =============================================================================
# WellnessZ Helm chart - default values (secure, cloud-neutral).
# Layer a platform file on top:
#   -f values.yaml -f values-azure.yaml | values-gcp.yaml | values-hybrid.yaml | values-local.yaml
# Secrets are NEVER set in values files: they are mounted from Azure Key Vault,
# GCP Secret Manager or HashiCorp Vault through the Secrets Store CSI driver
# (secrets.provider) or, for local clusters only, from a pre-created Secret.
# =============================================================================

global:
  # Registry + repository prefix, e.g. ghcr.io/acme/wellnessz, myacr.azurecr.io/wellnessz,
  # europe-west4-docker.pkg.dev/my-project/wellnessz
  imageRegistry: ghcr.io/OWNER/wellnessz
  # Defaults to .Chart.AppVersion when empty. CD sets this to the release tag.
  imageTag: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Environment name (local|dev|uat|prod) - label, OTel deployment.environment.
  environment: dev
  # Refuse to render unless every enabled component is pinned by digest
  # (component.image.digest). On in prod: only the signed release digests that
  # passed dev and uat can be deployed (set by .github/workflows/deploy-env.yml).
  requireImageDigests: false
  # Spring profile(s) for core and bff (local|azure|gcp|hybrid|prod)
  springProfiles: prod
  # OpenShift: let the restricted-v2 SCC assign UIDs (omits runAsUser/runAsGroup/fsGroup)
  openshift: false
  commonLabels: {}
  commonAnnotations: {}

# -----------------------------------------------------------------------------
# Workload identity - no static cloud credentials in the cluster.
# -----------------------------------------------------------------------------
workloadIdentity:
  azure:
    enabled: false
    tenantId: ""
    # Client IDs of the user-assigned managed identities (Terraform outputs)
    clientIds:
      core: ""
      bff: ""
      migrations: ""
  gcp:
    enabled: false
    # Google service account emails (Terraform outputs)
    serviceAccounts:
      core: ""
      bff: ""
      migrations: ""

# -----------------------------------------------------------------------------
# Secrets - Secrets Store CSI driver (secrets-store.csi.x-k8s.io/v1)
#   provider: none  -> use secrets.existingSecret.* (envFrom), local clusters only
#   provider: azure -> Azure Key Vault provider (workload identity)
#   provider: gcp   -> GCP Secret Manager provider (workload identity)
#   provider: vault -> HashiCorp Vault provider (Kubernetes auth)
# Files land in <mountPath>/<component>/<fileName>; the apps read them through
# `file:` references (wz-secrets SecretResolver) or WZ_MASTER_KEY_FILE.
# -----------------------------------------------------------------------------
secrets:
  provider: none
  mountPath: /mnt/secrets
  # Also mirror into a Kubernetes Secret (secretObjects). Keep false so
  # secret material is not persisted in etcd.
  syncToKubernetesSecret: false
  azure:
    keyVaultName: ""
    tenantId: ""
    cloudName: AzurePublicCloud
  gcp:
    projectId: ""
    # "gke" = GKE-managed Secret Manager add-on (driver secrets-store-gke.csi.k8s.io)
    # "gcp" = open-source secrets-store-csi-driver-provider-gcp
    providerName: gke
  # CSI driver name; GKE add-on uses secrets-store-gke.csi.k8s.io
  csiDriver: secrets-store.csi.k8s.io
  vault:
    address: ""
    kubernetesMountPath: kubernetes
    roles:
      core: wellnessz-core
      bff: wellnessz-bff
      migrations: wellnessz-migrations
  # remoteName = Key Vault secret name / Secret Manager secret id / Vault "path#key"
  # env/format: export an env var pointing at the mounted file
  #   format: fileRef -> ENV=file:<path>   (wz-secrets SecretResolver, sensitive props)
  #   format: path    -> ENV=<path>        (e.g. WZ_MASTER_KEY_FILE)
  core:
    files:
      - fileName: wz-db-password
        remoteName: wz-db-password
        env: WZ_DB_PASSWORD
        format: fileRef
      - fileName: wz-master-key
        remoteName: wz-master-key
        env: WZ_MASTER_KEY_FILE
        format: path
      - fileName: wz-pseudonym-key
        remoteName: wz-pseudonym-key
        env: WZ_PSEUDONYM_KEY
        format: fileRef
  bff:
    files:
      - fileName: wz-bff-client-secret
        remoteName: wz-bff-client-secret
        env: WZ_BFF_CLIENT_SECRET
        format: fileRef
      - fileName: wz-bff-db-password
        remoteName: wz-bff-db-password
        env: WZ_BFF_DB_PASSWORD
        format: fileRef
      # Session-encryption key - deliberately NOT the core master key
      - fileName: wz-bff-session-key
        remoteName: wz-bff-session-key
        env: WZ_MASTER_KEY_FILE
        format: path
  migrations:
    files:
      # migrations.mode=app: merged into the core and bff volumes;
      # mode=job: mounted only into the Flyway Job.
      - fileName: wz-migrator-db-password
        remoteName: wz-migrator-db-password
        env: WZ_DB_MIGRATOR_PASSWORD
        format: fileRef
  # provider=none only: names of pre-created Secrets injected with envFrom.
  existingSecret:
    core: ""
    bff: ""
    migrations: ""

# -----------------------------------------------------------------------------
# Database migrations (Flyway) - core (schemas platform..analytics) and bff
# (schema bff, Spring Session tables). Table-level grants come from the
# migrations via the ${app_role} placeholder.
#   app: core and bff run Flyway on start-up as the schema-owner role
#        (WZ_DB_MIGRATOR_USERNAME / WZ_DB_MIGRATOR_PASSWORD)
#   job: a pre-install/pre-upgrade Job runs Flyway CLI; core then runs with
#        Flyway disabled and never holds the migrator credential (preferred
#        for prod - least privilege).
# -----------------------------------------------------------------------------
migrations:
  mode: app
  migratorUsername: wz_migrator
  job:
    image:
      repository: flyway/flyway
      tag: 11.20.3-alpine
      # sha256 digest of the (mirrored) Flyway image; set it in UAT/PROD so the migration Job is pinned like the
      # product images (go-live item, security assessment 2026-10). Takes precedence over tag.
      digest: ""
      fullName: ""   # overrides repository:tag / @digest when set (e.g. mirrored image)
    # Location of SQL migrations inside the images (Spring Boot layered extraction)
    core:
      locationInImage: /app/BOOT-INF/classes/db/migration
      schemas: platform,masterdata,intake,casemgmt,triage,docs,ohrecord,fitness,absence,surveillance,scheduling,treatment,claims,mentalhealth,substance,travelhealth,promotion,analytics
      table: flyway_schema_history
      appRole: wz_app
    bff:
      locationInImage: /app/BOOT-INF/classes/db/bff
      schemas: bff
      table: flyway_schema_history_bff
      appRole: wz_bff
    # JDBC URL for Flyway; defaults to core.env.WZ_DB_URL
    dbUrl: ""
    extraArgs: []
    backoffLimit: 1
    activeDeadlineSeconds: 900
    ttlSecondsAfterFinished: 86400
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }

# -----------------------------------------------------------------------------
# Shared pod hardening (applied to every workload)
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: ["ALL"]

# -----------------------------------------------------------------------------
# Observability knobs per environment (rendered into the core/bff ConfigMaps;
# empty = application default)
#   logLevel       -> LOGGING_LEVEL_COM_WELLNESSZ
#   rootLogLevel   -> LOGGING_LEVEL_ROOT
#   traceSampling  -> MANAGEMENT_TRACING_SAMPLING_PROBABILITY (+ WZ_TRACE_SAMPLING), 0.0-1.0
# -----------------------------------------------------------------------------
observability:
  logLevel: ""
  rootLogLevel: ""
  traceSampling: ""

topologySpread:
  enabled: true
  # ScheduleAnyway keeps single-zone clusters schedulable; use DoNotSchedule in prod.
  whenUnsatisfiable: ScheduleAnyway

# -----------------------------------------------------------------------------
# Core API (apps/wz-core-app)
# -----------------------------------------------------------------------------
core:
  enabled: true
  name: core
  image:
    repository: wz-core-app
    tag: ""
    digest: ""      # sha256:... - takes precedence over tag (recommended in prod)
  replicaCount: 2
  runAsUser: 10001
  ports:
    http: 8080
    management: 8081
  service:
    type: ClusterIP
    annotations: {}
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 1536Mi }
  tmpSizeLimit: 512Mi
  probes:
    livenessPath: /actuator/health/liveness
    readinessPath: /actuator/health/readiness
    startupFailureThreshold: 36   # x5s = 3 min (Flyway on first start)
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Non-secret configuration (rendered into a ConfigMap)
  env:
    # sslmode is set through WZ_DB_SSLMODE (app default verify-full)
    WZ_DB_URL: "jdbc:postgresql://postgres.example.internal:5432/wellnessz?sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory"
    WZ_DB_USERNAME: wz_app
    WZ_DB_SSLMODE: verify-full
    WZ_OIDC_ISSUERS: ""
    WZ_OIDC_AUDIENCE: wellnessz-api
    WZ_CORS_ORIGINS: ""
    WZ_ANALYTICS_MIN_GROUP: "5"
    WZ_EHS_MAILBOX_MODE: none
    WZ_SMTP_HOST: ""
    WZ_SMTP_PORT: "587"
    # links in content-free notifications – keep in line with ingress.hosts
    WZ_EMPLOYEE_PORTAL_URL: "https://employee.wellnessz.example.com"
    WZ_MANAGER_WORKSPACE_URL: "https://manager.wellnessz.example.com"
    WZ_OH_WORKSPACE_URL: "https://oh.wellnessz.example.com"
    WZ_PARTNER_PORTAL_URL: "https://partners.wellnessz.example.com"
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    OTEL_SERVICE_NAME: wz-core-app
  extraEnv: []

# -----------------------------------------------------------------------------
# Backend-for-Frontend (apps/wz-bff)
# -----------------------------------------------------------------------------
bff:
  enabled: true
  name: bff
  image:
    repository: wz-bff
    tag: ""
    digest: ""
  replicaCount: 2
  runAsUser: 10001
  ports:
    http: 8090
    management: 8081
  service:
    type: ClusterIP
    annotations: {}
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  tmpSizeLimit: 256Mi
  probes:
    livenessPath: /actuator/health/liveness
    readinessPath: /actuator/health/readiness
    startupFailureThreshold: 24
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env:
    WZ_BFF_ISSUER_URI: ""
    WZ_BFF_CLIENT_ID: wellnessz-bff
    # Empty = in-cluster core Service (http://<release>-core:8080). Set when
    # core runs elsewhere (hybrid: on-prem core over private connectivity).
    WZ_CORE_API_URL: ""
    WZ_BFF_POST_LOGOUT_URI: ""
    # Session store: empty = core.env.WZ_DB_URL (schema bff, role wz_bff)
    WZ_BFF_DB_URL: ""
    WZ_BFF_DB_USERNAME: wz_bff
    WZ_DB_SSLMODE: verify-full
    WZ_COOKIE_SECURE: "true"
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    OTEL_SERVICE_NAME: wz-bff
  extraEnv: []

