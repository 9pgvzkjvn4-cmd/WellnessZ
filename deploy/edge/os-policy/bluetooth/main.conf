# =============================================================================
# WellnessZ gateway / BLE helper host - BlueZ policy (SC-04, E34-HLR-04)
# Install: /etc/bluetooth/main.conf (BlueZ >= 5.66: Debian 12 ships 5.66, Ubuntu 24.04 ships 5.72),
# then `systemctl restart bluetooth`. Companion: input.conf in this folder.
# Scope: only for a site that runs a LOCAL BLE radio (helper host / future native BLE connector).
# The wz-device-gateway itself has no BLE radio today: BLE readings arrive from the tablet / kiosk
# relay over TLS (BleIntakeServer, port 8097) and the gateway enforces the hashed peripheral
# allow-list from the core configuration. On sites without a local radio: disable the service
# (`systemctl mask bluetooth`) and blacklist the modules (cloud-init does this by default).
# RECIPE ONLY - not verified against real peripherals in this repository.
# =============================================================================
[General]
Name = wz-gateway
# LE only - no BR/EDR Classic (no SPP / HID / audio attack surface)
ControllerMode = le
# Pairing only during an operator-initiated pairing window (bluetoothctl pairable on; 120 s)
AlwaysPairable = false
PairableTimeout = 120
DiscoverableTimeout = 120
# LE Secure Connections only (no legacy pairing); never silently re-pair a "Just Works" bond
SecureConnections = only
JustWorksRepairing = never
# Resolvable private address for the controller
Privacy = device
# No debug link keys
DebugKeys = false

[GATT]
# Maximum encryption key size (16 bytes) for LE links
KeySize = 16
Cache = always

[Policy]
# Do not auto-reconnect arbitrary devices; the allow-listed peripherals are bonded explicitly
ReconnectAttempts = 0
AutoEnable = false
