# =============================================================================
# Drop-in for apps/wz-device-gateway/service/linux/wellnessz-gateway.service
# Install: /etc/systemd/system/wellnessz-gateway.service.d/10-wellnessz-hardening.conf
#   systemctl daemon-reload && systemctl restart wellnessz-gateway
# 1. Root key from a TPM2-sealed systemd credential instead of a key file on disk
#    (E34-BL-014 "keys not hardware-sealed by the agent" - sealed by the OS, see ../../secure-boot-tpm.md):
#      openssl rand -base64 32 | systemd-creds encrypt --with-key=tpm2 --tpm2-pcrs=7 --name=wz-master-key - \
#        /etc/wellnessz/gateway/wz-master-key.cred
#    systemd decrypts it into a private, non-swappable credentials directory readable only by the service.
# 2. Additional sandboxing on top of the unit's own hardening.
# RECIPE ONLY: systemd >= 252 (Debian 12 / Ubuntu 24.04). Verify with `systemd-analyze security wellnessz-gateway`.
# =============================================================================
[Service]
LoadCredentialEncrypted=wz-master-key:/etc/wellnessz/gateway/wz-master-key.cred
Environment=WZ_MASTER_KEY_FILE=%d/wz-master-key
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
RemoveIPC=true
PrivateUsers=true
KeyringMode=private
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @mount @swap @reboot @debug @obsolete @cpu-emulation
# (@resources stays allowed: the JVM raises RLIMIT_NOFILE at start-up)
SystemCallErrorNumber=EPERM
# Status page on loopback only (defence in depth for the LoopbackOnlyFilter)
IPAddressDeny=any
IPAddressAllow=localhost
IPAddressAllow=10.10.30.0/24
IPAddressAllow=10.200.0.10/32
# ^ device VLAN (listeners) and the device ingest LB - replace with the site values (same as the nftables set)
