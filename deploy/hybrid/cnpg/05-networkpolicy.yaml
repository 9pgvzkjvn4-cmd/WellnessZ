# Only the WellnessZ core API and migration job (namespace wellnessz) and the
# CNPG operator may reach the database pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wellnessz-db-ingress
  namespace: wellnessz-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: wellnessz-db
  policyTypes: [Ingress]
  ingress:
    # Application (core + Flyway job)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: wellnessz
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [core, migrations]
      ports:
        - { protocol: TCP, port: 5432 }
    # Replication between instances
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: wellnessz-db
      ports:
        - { protocol: TCP, port: 5432 }
    # CNPG operator status / instance manager
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 5432 }
    # Metrics scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 9187 }
