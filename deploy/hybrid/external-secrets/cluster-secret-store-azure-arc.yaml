# Alternative: Azure Key Vault as the secret source for an Arc-enabled
# on-prem cluster. Arc-enabled Kubernetes supports workload identity
# federation (cluster OIDC issuer registered with Entra ID), so ESO and the
# Azure Key Vault Secrets Provider extension authenticate without static
# credentials. Install the Arc extension:
#   az k8s-extension create --cluster-type connectedClusters \
#     --extension-type Microsoft.Azure.KeyVault.SecretsProvider -n akvsecretsprovider ...
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault-wellnessz
spec:
  provider:
    azurekv:
      vaultUrl: https://<key-vault-name>.vault.azure.net
      authType: WorkloadIdentity
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
  conditions:
    - namespaces: [wellnessz-db]
