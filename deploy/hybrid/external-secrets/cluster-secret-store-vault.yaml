# Per environment: render with WZ_ENV=dev|uat|prod, e.g.
#   WZ_ENV=uat envsubst '$WZ_ENV' < cluster-secret-store-vault.yaml > /tmp/cluster-secret-store-vault.yaml
# (matches kv/data/wellnessz/<env>/... and kubernetes-wellnessz-<env> in helm/wellnessz/environments/hybrid/<env>.yaml)
# External Secrets Operator -> HashiCorp Vault (KV v2) using Kubernetes auth.
# Used for secrets that must exist as Kubernetes Secrets because a third-party
# operator consumes them (CloudNativePG role passwords, backup credentials).
# Application pods do NOT use these: they mount secrets via the Secrets Store
# CSI driver (Helm values-hybrid.yaml, secrets.provider=vault).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-wellnessz
spec:
  provider:
    vault:
      server: https://vault.onprem.example.internal:8200
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: internal-pki-ca
        namespace: external-secrets
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes-wellnessz-${WZ_ENV}
          role: wellnessz-db-operator-${WZ_ENV}
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
  conditions:
    - namespaces: [wellnessz-db]
