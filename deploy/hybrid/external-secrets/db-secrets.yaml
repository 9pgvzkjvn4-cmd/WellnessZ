# Per environment: render with WZ_ENV=dev|uat|prod, e.g.
#   WZ_ENV=uat envsubst '$WZ_ENV' < db-secrets.yaml > /tmp/db-secrets.yaml
# (matches kv/data/wellnessz/<env>/... and kubernetes-wellnessz-<env> in helm/wellnessz/environments/hybrid/<env>.yaml)
# Role passwords for CloudNativePG (basic-auth secrets) and backup credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wellnessz-db-migrator
  namespace: wellnessz-db
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-wellnessz
  target:
    name: wellnessz-db-migrator
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: wz_migrator
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: wellnessz/${WZ_ENV}/migrations
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wellnessz-db-app
  namespace: wellnessz-db
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-wellnessz
  target:
    name: wellnessz-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"   # CNPG re-applies the role password on change
      data:
        username: wz_app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: wellnessz/${WZ_ENV}/core
        property: wz-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wellnessz-db-bff
  namespace: wellnessz-db
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-wellnessz
  target:
    name: wellnessz-db-bff
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: wz_bff
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: wellnessz/${WZ_ENV}/bff
        property: wz-bff-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wellnessz-backup-s3
  namespace: wellnessz-db
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-wellnessz
  target:
    name: wellnessz-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: wellnessz/${WZ_ENV}/backup
        property: access_key_id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: wellnessz/${WZ_ENV}/backup
        property: secret_access_key
