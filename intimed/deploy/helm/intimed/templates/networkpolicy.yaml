{{- if .Values.networkPolicy.enabled }}
# Default deny for the IntiMed pod; only the flows of docs/security/Network-Reference-Designs.md (cloud design).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intimed
  labels: {{- include "intimed.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "intimed.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: {{ required "networkPolicy.appGatewaySubnetCidr is required" .Values.networkPolicy.appGatewaySubnetCidr }} }
      ports: [ { port: 9443, protocol: TCP } ]
    - from:
        {{- range (required "networkPolicy.deviceSourceCidrs is required" .Values.networkPolicy.deviceSourceCidrs) }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
        - ipBlock: { cidr: 168.63.129.16/32 }   # Azure load balancer health probes
      ports: [ { port: 2575, protocol: TCP }, { port: 8443, protocol: TCP } ]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }   # ama-metrics (Managed Prometheus)
      ports: [ { port: 9444, protocol: TCP } ]
    - from:
        - podSelector: { matchLabels: { intimed.io/role: smoke } }   # helm test only
      ports: [ { port: 9443, protocol: TCP }, { port: 9444, protocol: TCP } ]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [ { port: 53, protocol: UDP }, { port: 53, protocol: TCP } ]
    - to:
        - ipBlock: { cidr: {{ required "networkPolicy.postgresSubnetCidr is required" .Values.networkPolicy.postgresSubnetCidr }} }
      ports: [ { port: 5432, protocol: TCP } ]
    # HTTPS: Key Vault / Storage private endpoints, Entra ID token endpoint, allow-listed webhooks and register feeds.
    # FQDN filtering is enforced by Azure Firewall (production) on the AKS egress route.
    - ports: [ { port: 443, protocol: TCP } ]
---
# DB bootstrap job: DNS, PostgreSQL and Entra (token exchange) only; no ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intimed-db-bootstrap
  labels: {{- include "intimed.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: intimed-db-bootstrap }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [ { port: 53, protocol: UDP }, { port: 53, protocol: TCP } ]
    - to:
        - ipBlock: { cidr: {{ .Values.networkPolicy.postgresSubnetCidr }} }
      ports: [ { port: 5432, protocol: TCP } ]
    - ports: [ { port: 443, protocol: TCP } ]
{{- end }}
