{{- if .Values.database.bootstrap.enabled }}
# One-time / rotation job (pre-install, pre-upgrade): creates or rotates the application's least-privilege PostgreSQL
# role with the server administrator. The admin password is mounted only into this short-lived pod.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: intimed-kv-dbadmin
  labels: {{- include "intimed.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.azure.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.azure.keyVaultName | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: intimed-db-admin-password
          objectType: secret
        - |
          objectName: intimed-db-password
          objectType: secret
  secretObjects:
    - secretName: intimed-dbadmin
      type: Opaque
      data:
        - { objectName: intimed-db-admin-password, key: INTIMED_DB_ADMIN_PASSWORD }
        - { objectName: intimed-db-password, key: INTIMED_DB_PASSWORD }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intimed-dbadmin
  labels: {{- include "intimed.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    azure.workload.identity/client-id: {{ .Values.azure.workloadIdentityClientId | quote }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: intimed-db-bootstrap
  labels: {{- include "intimed.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intimed-db-bootstrap
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: intimed-dbadmin
      automountServiceAccountToken: true
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: bootstrap
          image: {{ include "intimed.image" . }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          args: ["sdk", "db-bootstrap", "--url", {{ printf "jdbc:postgresql://%s:5432/%s?%s" .Values.database.host .Values.database.name .Values.database.params | quote }},
                 "--admin", {{ .Values.database.bootstrap.adminUser | quote }}, "--app-user", {{ .Values.database.user | quote }}]
          env: [ { name: JAVA_TOOL_OPTIONS, value: "-Xmx192m" } ]
          envFrom: [ { secretRef: { name: intimed-dbadmin } } ]
          resources: { requests: { cpu: 100m, memory: 320Mi }, limits: { memory: 320Mi } }
          volumeMounts:
            - { name: kv, mountPath: /mnt/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: kv
          csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: intimed-kv-dbadmin } }
        - name: tmp
          emptyDir: {}
{{- end }}
