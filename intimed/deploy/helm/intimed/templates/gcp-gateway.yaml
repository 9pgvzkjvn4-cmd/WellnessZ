{{- if and (eq .Values.cloud "gcp") .Values.gcp.console.publish }}
# Console publication on GKE: regional external Application Load Balancer in me-central1 (TLS terminates in Doha),
# static regional IP, public certificate from a kubernetes.io/tls secret, HTTP→HTTPS redirect, TLS ≥ 1.2,
# Cloud Armor (OWASP CRS 3.3 + rate limit, Terraform) on the backend, HTTPS health check on /api/public/info.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: intimed-console
  labels: {{- include "intimed.labels" . | nindent 4 }}
spec:
  gatewayClassName: gke-l7-regional-external-managed
  {{- if .Values.gcp.console.ipName }}
  addresses:
    - type: NamedAddress
      value: {{ .Values.gcp.console.ipName | quote }}
  {{- end }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ required "gcp.console.hostname is required" .Values.gcp.console.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gcp.console.tlsSecretName | quote }}
      allowedRoutes: { namespaces: { from: Same } }
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.gcp.console.hostname | quote }}
      allowedRoutes: { namespaces: { from: Same } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: intimed-console
  labels: {{- include "intimed.labels" . | nindent 4 }}
spec:
  parentRefs:
    - { name: intimed-console, sectionName: https }
  hostnames: [{{ .Values.gcp.console.hostname | quote }}]
  rules:
    - backendRefs:
        - { name: intimed-console, port: 443 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: intimed-console-redirect
  labels: {{- include "intimed.labels" . | nindent 4 }}
spec:
  parentRefs:
    - { name: intimed-console, sectionName: http }
  hostnames: [{{ .Values.gcp.console.hostname | quote }}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: intimed-console
  labels: {{- include "intimed.labels" . | nindent 4 }}
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTPS
      httpsHealthCheck:
        port: 9443
        requestPath: /api/public/info
  targetRef: { group: "", kind: Service, name: intimed-console }
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: intimed-console
  labels: {{- include "intimed.labels" . | nindent 4 }}
spec:
  default:
    timeoutSec: 60
    {{- if .Values.gcp.console.armorPolicy }}
    securityPolicy: {{ .Values.gcp.console.armorPolicy | quote }}
    {{- end }}
    logging: { enabled: true, sampleRate: 1000000 }
  targetRef: { group: "", kind: Service, name: intimed-console }
---
apiVersion: networking.gke.io/v1
kind: GCPGatewayPolicy
metadata:
  name: intimed-console
  labels: {{- include "intimed.labels" . | nindent 4 }}
spec:
  default:
    sslPolicy: intimed-tls12-modern
  targetRef: { group: gateway.networking.k8s.io, kind: Gateway, name: intimed-console }
{{- end }}
{{- if eq .Values.cloud "gcp" }}
# Managed Service for Prometheus scrapes the platform's management port.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: intimed
  labels: {{- include "intimed.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "intimed.selector" . | nindent 6 }}
  endpoints:
    - port: mgmt
      path: /actuator/prometheus
      interval: 30s
{{- end }}
