{{- if eq .Values.cloud "gcp" }}
# Secret Manager (Doha) → pod files via the GKE Secret Manager add-on with Workload Identity. Files are named after
# the variables they provide (INTIMED_MASTER_KEY, INTIMED_DB_PASSWORD) and read from /mnt/secrets by the platform.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: intimed-kv
  labels: {{- include "intimed.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "gcp.projectId is required" .Values.gcp.projectId }}/secrets/intimed-master-key/versions/latest"
        path: "INTIMED_MASTER_KEY"
      - resourceName: "projects/{{ .Values.gcp.projectId }}/secrets/intimed-db-password/versions/latest"
        path: "INTIMED_DB_PASSWORD"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: intimed-pg-ca
  labels: {{- include "intimed.labels" . | nindent 4 }}
data:
  server-ca.pem: {{ required "gcp.sqlServerCaPem is required" .Values.gcp.sqlServerCaPem | quote }}
{{- else }}
# Key Vault → pod via the Secrets Store CSI driver (AKS add-on) with workload identity. The master key (root KEK) and
# the database password never exist in Helm values, Git or Terraform state.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: intimed-kv
  labels: {{- include "intimed.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.azure.workloadIdentityClientId | quote }}
    keyvaultName: {{ required "azure.keyVaultName is required" .Values.azure.keyVaultName | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: intimed-master-key
          objectType: secret
        - |
          objectName: intimed-db-password
          objectType: secret
  secretObjects:
    - secretName: intimed-runtime
      type: Opaque
      data:
        - objectName: intimed-master-key
          key: INTIMED_MASTER_KEY
        - objectName: intimed-db-password
          key: INTIMED_DB_PASSWORD
{{- end }}
