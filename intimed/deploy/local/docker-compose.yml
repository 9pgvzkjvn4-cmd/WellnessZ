# IntiMed LOCAL with containers (Colima or Docker Desktop on a MacBook). Production-like dependencies:
# PostgreSQL 16 (canonical store) and HashiCorp Vault in dev mode (secrets provider). Ports bound to 127.0.0.1 only.
#   cp .env.example .env   # set POSTGRES_PASSWORD, INTIMED_MASTER_KEY (base64 32 bytes), VAULT_DEV_ROOT_TOKEN_ID
#   docker compose up --build
name: intimed-local
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: intimed
      POSTGRES_USER: intimed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U intimed"], interval: 5s, retries: 20 }
    networks: [core]
  vault:
    image: hashicorp/vault:1.20.4
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:?set VAULT_DEV_ROOT_TOKEN_ID in .env}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["127.0.0.1:8200:8200"]
    networks: [core]
  intimed:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    depends_on: { postgres: { condition: service_healthy }, vault: { condition: service_started } }
    command: ["--spring.profiles.active=postgres${INTIMED_EXTRA_PROFILES:-}"]
    environment:
      INTIMED_DB_URL: jdbc:postgresql://postgres:5432/intimed
      INTIMED_DB_USER: intimed
      INTIMED_DB_PASSWORD: ${POSTGRES_PASSWORD}
      INTIMED_MASTER_KEY: ${INTIMED_MASTER_KEY:?set INTIMED_MASTER_KEY in .env}
      INTIMED_SECRETS_PROVIDER: vault
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
      SPRING_APPLICATION_JSON: '{"intimed":{"secrets":{"vault":{"address":"http://vault:8200"}}}}'
    ports: ["127.0.0.1:9443:9443", "127.0.0.1:8443:8443", "127.0.0.1:2575:2575"]
    volumes: [intimed-data:/data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [core]
volumes: { pgdata: {}, intimed-data: {} }
networks: { core: {} }
