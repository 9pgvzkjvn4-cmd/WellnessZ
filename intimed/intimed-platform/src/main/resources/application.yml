# IntiMed – LOCAL environment setting (MacBook). DEV/UAT/PROD values come from Helm/Terraform overlays (see deploy/).
spring:
  application:
    name: intimed-platform
  threads:
    virtual:
      enabled: true
  datasource:
    # H2 file database encrypted at rest with AES (CIPHER=AES); file password derived at startup – see DataSourceConfig.
    url: jdbc:h2:file:${intimed.home:./intimed-data}/db/intimed;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CIPHER=AES;AUTO_SERVER=FALSE
    username: intimed
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${INTIMED_PORT:9443}
  address: ${INTIMED_BIND:127.0.0.1}
  ssl:
    enabled: true
    enabled-protocols: TLSv1.3,TLSv1.2
  http2:
    enabled: true
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
        http-only: true
        same-site: strict
        name: INTIMED_SESSION
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB

management:
  server:
    port: ${INTIMED_MGMT_PORT:9444}
    address: 127.0.0.1
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,sbom
  endpoint:
    health:
      probes:
        enabled: true

intimed:
  home: ${INTIMED_HOME:./intimed-data}
  environment: LOCAL
  device:
    mllp-port: ${INTIMED_MLLP_PORT:2575}
    ingress-port: ${INTIMED_INGRESS_PORT:8443}
  secrets:
    provider: ${INTIMED_SECRETS_PROVIDER:local}
  feeds:
    openfda:
      enabled: ${INTIMED_OPENFDA:false}
    # IM-E02-BL-003 – UDI registers (reviewer approval before any catalogue update); disabled by default
    gudid:
      enabled: ${INTIMED_GUDID:false}
      base-url: https://accessgudid.nlm.nih.gov
    eudamed:
      enabled: ${INTIMED_EUDAMED:false}
      # EUDAMED public API is not contractual – shape is configuration (see UdiFeedService Javadoc)
      base-url: https://ec.europa.eu/tools/eudamed/api
      search-path: "/devices/udiDiData?page=0&pageSize=10&iso2Code=en&primaryDi={di}"
      text-search-path: "/devices/udiDiData?page=0&pageSize=10&iso2Code=en&tradeName={q}"
      results-pointer: /content
      fields: "di:/primaryDi,tradeName:/tradeName,manufacturer:/manufacturerName,model:/reference,riskClass:/riskClass/code,status:/deviceStatusType/code"
    allowed-hosts: api.fda.gov,accessgudid.nlm.nih.gov,ec.europa.eu
    allow-loopback-http: false
  # IM-E03-BL-006 – LLM explanation layer behind the policy gateway; off unless enabled here AND per tenant
  llm:
    enabled: ${INTIMED_LLM:false}
    endpoint: ${INTIMED_LLM_ENDPOINT:}
    deployment: ${INTIMED_LLM_DEPLOYMENT:}
    api-version: 2024-06-01
    auth: api-key
    api-key-ref: secret://azure-openai-key
    allowed-hosts: ${INTIMED_LLM_ALLOWED_HOSTS:}
    max-tokens: 600
    requests-per-minute: 10
    allow-loopback-http: false
  webhooks:
    allowed-hosts: localhost,127.0.0.1
  demo:
    enabled: false
    autoprovision: true

logging:
  level:
    root: INFO
    io.intimed: INFO
    org.springframework.security: WARN
---
spring:
  config:
    activate:
      on-profile: demo
intimed:
  demo:
    enabled: true
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${INTIMED_DB_URL:jdbc:postgresql://localhost:5432/intimed?sslmode=prefer}
    username: ${INTIMED_DB_USER:intimed}
    password: ${INTIMED_DB_PASSWORD:}
